    <label>Valor já pago</label>
    <input id="edValorPago" inputmode="decimal" value="${Number(r.paid_amount||0).toFixed(2).replace(".",",")}"
      oninput="recalcReserva('${id}')">
    <div id="edAviso" class="mut small" style="margin:-4px 0 8px"></div>
    <label>Forma de pagamento</label>
    <select id="edForma">${METHODS.filter(([k])=>k!=="credito_loja").map(([k,l])=>`<option value="${k}" ${r.paid_method===k?"selected":""}>${l}</option>`).join("")}</select>
    <label>Itens reservados</label>
    <div class="card" style="padding:8px 10px">
      ${(r.items||[]).map((i,ix)=>`<div class="row" style="padding:5px 0;border-bottom:1px dashed var(--line)">
        <span style="flex:1;min-width:0">${esc(i.product_name)}<br><span class="mut small">${fmt(i.unit_price)} cada</span></span>
        <input id="edQtd${ix}" inputmode="numeric" value="${i.qty}" style="width:64px;margin:0;text-align:center"
          oninput="recalcReserva('${id}')">
      </div>`).join("")}
      <div class="row" style="padding-top:8px"><span class="mut small">Soma dos itens</span>
        <b class="right num" id="edSoma">${fmt(r.total)}</b></div>
    </div>
    <label>Valor total da reserva</label>
    <input id="edTotal" inputmode="decimal" value="${Number(r.total).toFixed(2).replace(".",",")}"
      oninput="recalcReserva('${id}')">
    <div id="edDif" class="mut small" style="margin:-4px 0 8px">
    </div>
    </div>
    <p class="mut small">Quantidade 0 remove o item e devolve as unidades ao estoque.
      O valor total pode ser alterado à mão — útil para kits e combinados.</p>
    <div style="height:12px"></div>
    <button class="btn primary block" onclick="salvarEdicaoReserva('${id}')">Salvar alterações</button>`);
}
function itensEditados(r){
  return (r.items||[]).map((i,ix)=>{
    const q = Math.max(0, parseInt(($("edQtd"+ix)||{}).value) || 0);
    return { ...i, qty:q, subtotal: Math.round(Number(i.unit_price)*q*100)/100 };
  }).filter(i=>i.qty>0);
}
function recalcReserva(id){
  const r = RESERVAS.find(x=>x.id===id); if(!r) return;
  const soma = itensEditados(r).reduce((s,i)=>s+i.subtotal,0);
  const el = $("edSoma"); if(el) el.textContent = fmt(soma);
  const t = N($("edTotal").value);
  const dif = $("edDif");
  if(dif){
    const d = soma - t;
    dif.innerHTML = Math.abs(d)<0.005 ? "Igual à soma dos itens"
      : d>0 ? `<b>${fmt(d)}</b> abaixo da soma (desconto/kit)`
            : `<b>${fmt(-d)}</b> acima da soma`;
  }
  const av = $("edAviso"); if(!av) return;
  const pago = N($("edValorPago").value);
  if(pago > t + 0.004){ av.innerHTML = `Pagou <b>${fmt(pago-t)}</b> a mais — vira crédito ao salvar.`; av.style.color="var(--ok)"; }
  else if(pago < t - 0.004){ av.innerHTML = `Falta <b>${fmt(t-pago)}</b> — cobrar na retirada.`; av.style.color="var(--bad)"; }
  else { av.textContent = "Reserva quitada."; av.style.color="var(--mut)"; }
}
async function salvarEdicaoReserva(id){
  const r = RESERVAS.find(x=>x.id===id); if(!r) return;
  const nome = ($("edNome").value||"").trim();
  if(!nome){ toast("Informe o nome do cliente"); return; }
  const itens = itensEditados(r);
  if(!itens.length){ toast("A reserva precisa de pelo menos um item — para zerar tudo, cancele a reserva"); return; }
  const soma = itens.reduce((s,i)=>s+i.subtotal,0);
  const total = N($("edTotal").value) || soma;
  if(total <= 0){ toast("Informe o valor total da reserva"); return; }
  let valorPago = N($("edValorPago").value);
  const sobra = Math.round((valorPago - total)*100)/100;
  if(sobra > 0.004) valorPago = total;   // o excedente sai da reserva e vira crédito
  const { error } = await sb.rpc("ep_reserva_editar", { p_id:id, p: {
    customer_name:nome, customer_phone:($("edFone").value||"").trim(),
    notes:($("edObs").value||"").trim(), items:itens, total,
    paid_amount: valorPago, paid_method: valorPago>0 ? $("edForma").value : null }});
  if(error){ toast("Não foi possível salvar: "+error.message); return; }
  if(sobra > 0.004){
    const r2 = await sb.rpc("ep_credito_mov", { p_event:EVENT.id, p_nome:nome, p_fone:null,
      p_delta:sobra, p_motivo:"Pagou a mais na reserva", p_sale:null });
    if(!r2.error) toast(`Crédito de ${fmt(sobra)} para ${nome}`);
  }
  audit("reserva_editada",{id, total, pago:valorPago});
  closeModal(); toast("Reserva atualizada");
  await loadProducts(); renderReservas();
}

async function entregarReserva(id){
  const r = RESERVAS.find(x=>x.id===id); if(!r) return;
  if(!REG){ toast("Abra seu caixa antes de entregar uma reserva"); return; }
  openModal(`<h2>Entregar reserva</h2>
    <p class="mut small">${esc(r.customer_name)} · ${fmt(r.total)}</p>
    <div class="card" style="margin:8px 0">
      ${(r.items||[]).map(i=>`<div class="row small" style="padding:4px 0">

    </div>
    ${(()=>{ const pg=Number(r.paid_amount||0), falta=Number(r.total)-pg;
      if(falta <= 0.004) return `<div class="alertline ok">Já pago ${fmt(pg)} em ${mlabel(r.paid_method)} — nada a cobrar.</div>`;
      return `<div class="alertline amber">Já pago: <b>${fmt(pg)}</b> · <b>falta ${fmt(falta)}</b></div>
        <label>Forma de pagamento do restante</label>
        <select id="entForma">${METHODS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select>`; })()}

async function confirmarEntrega(id){
  const r = RESERVAS.find(x=>x.id===id); if(!r) return;
  const pg = Number(r.paid_amount||0), total = Number(r.total), falta = Math.round((total-pg)*100)/100;
  const pagamentos = [];
  if(pg > 0.004) pagamentos.push({ method: r.paid_method||"dinheiro", amount: Math.min(pg,total) });
  if(falta > 0.004) pagamentos.push({ method: $("entForma").value, amount: falta });
  if(!pagamentos.length) pagamentos.push({ method: r.paid_method||"dinheiro", amount: total });
  const { error } = await sb.rpc("ep_reserva_entregar", {
    p_id: id, p_payments: pagamentos, p_register: REG.id });
  if(error){ toast("Não foi possível entregar: "+error.message); return; }
  audit("reserva_entregue", { id, total:r.total, pagamentos });
  closeModal(); toast("Entregue — venda registrada");
  await loadProducts(); renderReservas();
}
async function cancelarReserva(id){
  const r = RESERVAS.find(x=>x.id===id); if(!r) return;
  if(!confirm(`Cancelar a reserva de ${r.customer_name}? Os produtos voltam ao estoque.`)) return;
  const { error } = await sb.rpc("ep_reserva_cancelar", { p_id: id });
  if(error){ toast(error.message); return; }
  audit("reserva_cancelada", { id });
  toast("Reserva cancelada"); await loadProducts(); renderReservas();
}

/* Filtra por código ou nome. Um item aparece também quando o texto casa com
   uma das suas cores (ex.: buscar EB-249.2 traz o produto principal). */
function filtrarProdutos(lista){
  const q = BUSCA_PROD.trim().toLowerCase();
  if(!q) return lista;
  const bate = p => String(p.code||"").toLowerCase().includes(q) || String(p.name||"").toLowerCase().includes(q);

}

/* ---------- MARGEM DE LUCRO ---------- */
/* markup = lucro sobre o CUSTO: preço = custo × (1 + m/100)
   margem sobre a VENDA: preço = custo ÷ (1 − m/100)  */
function markupPct(p){
  const c = Number(p.cost)||0, v = Number(p.price)||0;
  if(c<=0) return null;
  return (v-c)/c*100;
}
function precoPorMargem(cost, m, base){
  cost = Number(cost)||0; m = Number(m)||0;
  if(cost<=0) return 0;
  if(base==="venda"){
    if(m>=100) return 0;
    return cost/(1-m/100);
  }
  return cost*(1+m/100);
}
function recalcPreco(){
  const c = N($("prCost").value), m = N($("prMargem").value), base = $("prMargemBase").value;
  if(c<=0){ atualizaCalcBox(); return; }
  const v = precoPorMargem(c,m,base);
  $("prPrice").value = (Math.round(v*100)/100).toFixed(2).replace(".",",");
  atualizaCalcBox();
}
function recalcMargem(){
  const c = N($("prCost").value), v = N($("prPrice").value), base = $("prMargemBase").value;
  if(c>0 && v>0){
    const m = base==="venda" ? (v-c)/v*100 : (v-c)/c*100;
    $("prMargem").value = (Math.round(m*10)/10).toString().replace(".",",");
  }
  atualizaCalcBox();
}
function atualizaCalcBox(){
  const box = $("prCalc"); if(!box) return;
  const c = N($("prCost").value), v = N($("prPrice").value);
  if(c<=0){ box.innerHTML = `<span class="mut">Informe o custo unitário para calcular a margem automaticamente.</span>`; return; }
  if(v<=0){ box.innerHTML = `<span class="mut">Informe a margem desejada — o preço é calculado sozinho.</span>`; return; }
  const lucro = v-c;
  const sobreCusto = lucro/c*100, sobreVenda = lucro/v*100;
  box.innerHTML = `Lucro de <span class="num">${fmt(lucro)}</span> por unidade · <span class="num">${sobreCusto.toFixed(1)}%</span> sobre o custo · <span class="num">${sobreVenda.toFixed(1)}%</span> sobre a venda`;
}

async function renumerarGrupo(items){
  const ups = items.map((p,i)=> sb.from("ep_products").update({ sort_order:(i+1)*10 }).eq("id",p.id));
  const res = await Promise.all(ups);
  const err = res.find(r=>r.error);
  if(err){ toast("Não deu para salvar a ordem: "+err.error.message); return false; }
  return true;
}
async function moveProduto(pid, dir, inModal){
  const p = PRODUCTS.find(x=>x.id===pid); if(!p) return;
  const g = groupByCat(PRODUCTS).find(g=>g.items.some(x=>x.id===pid)); if(!g) return;
  const items = g.items.slice();
  const i = items.findIndex(x=>x.id===pid), j = i+dir;
  if(j<0 || j>=items.length) return;
  items.splice(j,0,items.splice(i,1)[0]);
  if(!await renumerarGrupo(items)) return;
  audit("produto_reordenado",{id:pid,dir});
  await loadProducts();
  if(inModal) modalOrdenar(); else renderProdutos();
}

  const groups = groupByCat(PRODUCTS);

/* ---------- VARIAÇÕES POR COR ----------
   Uma variação é um produto-filho (parent_id preenchido), com código EB-249.1,
   EB-249.2… Cada cor tem foto e estoque próprios, então a venda baixa o estoque
   da cor certa. O produto-pai não é vendido direto: ao tocar nele, abre a lista
   de cores. */
const filhosDe = pid => PRODUCTS.filter(p=>p.parent_id===pid)
  .sort((a,b)=> String(a.code||"").localeCompare(String(b.code||""), "pt-BR", {numeric:true}));
const temFilhos = pid => PRODUCTS.some(p=>p.parent_id===pid);
const estoqueTotal = p => temFilhos(p.id) ? filhosDe(p.id).reduce((s,f)=>s+Number(f.stock||0),0) : Number(p.stock||0);

function proximoCodigoVar(pai){
  const base = pai.code || "SEM";
  const usados = filhosDe(pai.id).map(f=>{
    const m = String(f.code||"").match(/\.(\d+)$/); return m ? parseInt(m[1]) : 0;
  });
  return `${base}.${Math.max(0, ...usados) + 1}`;
}

async function addVariacao(pid){
  const pai = PRODUCTS.find(p=>p.id===pid); if(!pai) return;
  const nome = ($("vcNome").value||"").trim();
  const qtd = parseInt($("vcQtd").value)||0;
  if(!nome){ toast("Informe o nome da cor"); return; }
  if(qtd < 0){ toast("Quantidade inválida"); return; }
  if(qtd > Number(pai.stock)){ toast(`O produto principal só tem ${pai.stock} un livres`); return; }
  const code = proximoCodigoVar(pai);
  const row = {
    event_id: EVENT.id, parent_id: pai.id, code,
    name: `${pai.name} — ${nome}`,
    category_id: pai.category_id, price: pai.price, cost: pai.cost,
    stock: qtd, stock_initial: qtd, min_stock: 0, active: true,
    margin_pct: pai.margin_pct, sort_order: Number(pai.sort_order)||0
  };
  const ins = await sb.from("ep_products").insert(row);
  if(ins.error){ toast(ins.error.message); return; }
  // a quantidade sai do estoque do pai, para não contar duas vezes
  if(qtd > 0){
    await sb.from("ep_products").update({ stock: Number(pai.stock) - qtd }).eq("id", pai.id);
  }
  audit("variacao_criada", { parent:pai.code, code, qtd });
  await loadProducts(); modalVariacoes(pid); toast(`${code} criada`);
}
async function delVariacao(fid){
  const f = PRODUCTS.find(p=>p.id===fid); if(!f) return;
  if(!confirm(`Excluir a cor "${f.name}"? As ${f.stock} un voltam para o produto principal.`)) return;
  const pai = PRODUCTS.find(p=>p.id===f.parent_id);
  const del = await sb.from("ep_products").delete().eq("id", fid);
  if(del.error){ toast("Não foi possível excluir (pode haver vendas ligadas). "+del.error.message); return; }
  if(pai && Number(f.stock)>0){
    await sb.from("ep_products").update({ stock: Number(pai.stock) + Number(f.stock) }).eq("id", pai.id);
  }
  audit("variacao_excluida", { code:f.code });
  await loadProducts();
  if(pai) modalVariacoes(pai.id); else renderProdutos();
}

async function salvarProduto(pid, voltarPara){
  const cost = N($("prCost").value), price = N($("prPrice").value);
  const row = { event_id:EVENT.id, code: ($("prCode").value.trim().toUpperCase() || null), name:$("prName").value.trim(), price, cost,
    stock_initial:parseInt($("prSt0").value)||0, stock:parseInt($("prSt").value)||0, min_stock:parseInt($("prMin").value)||0,
    active:$("prAtivo").value==="1", image_url: PROD_IMG || null,
    category_id: $("prCat").value || null,
    margin_pct: cost>0 ? Math.round((price-cost)/cost*1000)/10 : null };
  const orig = PRODUCTS.find(x=>x.id===pid);
  if(orig && orig.parent_id) row.parent_id = orig.parent_id;
  if(!row.name||row.price<=0){ toast("Nome e preço são obrigatórios"); return; }
  if(!pid){
    // novo produto entra no fim da sua categoria
    const irmaos = PRODUCTS.filter(x=>(x.category_id||null)===row.category_id);
    row.sort_order = (irmaos.reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),0) || 0) + 10;
  }
  const r = pid ? await sb.from("ep_products").update(row).eq("id",pid) : await sb.from("ep_products").insert(row);
  if(r.error){ toast(r.error.message); return; }
  audit(pid?"produto_editado":"produto_criado",{name:row.name});
  PROD_IMG=null; closeModal(); toast("Salvo");
  await loadProducts();
  if(voltarPara) modalVariacoes(voltarPara); else renderProdutos();
}

let SALES_CACHE = [];
async function renderVendas(){
  const el=$("view-vendas");
  if(!EVENT){ el.innerHTML=`<div class="card mut">Nenhum evento aberto.</div>`; return; }
  const D = await eventData(EVENT.id);
  SALES_CACHE = D.sales; window._pn = id => (D.profs.find(p=>p.id===id)||{name:"?"}).name;

    <input id="saleSearch" placeholder="Pesquisar por código, operador ou produto…" oninput="filterVendas()">

function filterVendas(){
  const q = ($("saleSearch").value||"").toLowerCase();

    if(!q) return true;
    return s.id.slice(0,8).includes(q) || window._pn(s.operator_id).toLowerCase().includes(q) ||
      (s.ep_sale_items||[]).some(i=>{ const p=PRODUCTS.find(x=>x.id===i.product_id); return p&&p.code&&p.code.toLowerCase().includes(q); }) ||
      (s.ep_sale_items||[]).some(i=>i.product_name.toLowerCase().includes(q));
  }).slice(0,120);
  $("salesList").innerHTML = list.map(s=>`<div class="card" style="padding:12px">
    <div class="row"><b class="num">${fmt(s.total)}</b>
      ${s.status==="cancelada"?'<span class="tag bad">cancelada</span>':""}

      ${s.status==="ok"?`<button class="btn small danger right" onclick="modalCancelar('${s.id}')">Cancelar</button>`:""}
      ${isAdmin()?`<button class="btn small ghost ${s.status==="ok"?"":"right"}" onclick="delVenda('${s.id}','${s.status}')">Excluir</button>`:""}
    </div>
    <div class="mut small">${(s.ep_sale_items||[]).map(i=>`${i.qty}x ${esc(i.product_name)}`).join(", ")}
      · ${(s.ep_sale_payments||[]).map(p=>mlabel(p.method)).join(" + ")}
      ${Number(s.discount)>0.004?` · <span style="color:var(--bad);font-weight:700">desconto ${fmt(s.discount)}</span>`:""}
      ${s.cancel_reason?` · motivo: ${esc(s.cancel_reason)}`:""}</div>
    <button class="btn small ghost" style="margin-top:6px" onclick="modalResumoVenda('${s.id}')">Ver resumo</button>
    ${s.status==="ok"?`<button class="btn small ghost" style="margin-top:6px" onclick="editarVenda('${s.id}')">Editar</button>`:""}
  </div>`).join("") || `<div class="card mut">Nenhuma venda encontrada.</div>`;

/* ---------- EDITAR VENDA ----------
   Para trocas ("levo este no lugar daquele e pago a diferença") e correções.
   O estoque é reajustado pela diferença entre os itens antigos e os novos. */
let VENDA_EDIT = null;

function editarVenda(sid){
  const s = (SALES_CACHE||[]).find(x=>x.id===sid);
  if(!s){ toast("Venda não encontrada"); return; }
  if(s.status!=="ok"){ toast("Só dá para editar venda ativa"); return; }
  VENDA_EDIT = {
    id: s.id,
    itens: (s.ep_sale_items||[]).map(i=>({
      product_id: i.product_id, product_name: i.product_name, qty: i.qty,
      unit_price: Number(i.unit_price), unit_cost: Number(i.unit_cost||0)
    })),
    pagamentos: (s.ep_sale_payments||[]).length
        ? (s.ep_sale_payments||[]).map(p=>({ method:p.method, amount:Number(p.amount) }))
        : [{ method:"dinheiro", amount:Number(s.total) }],
    totalManual: null,
    recebido: null,
    cliente: "",
    quando: s.created_at
  };
  telaEditarVenda();
}
const somaEdit = () => VENDA_EDIT.itens.reduce((a,i)=>a+i.unit_price*i.qty, 0);
const custoEdit = () => VENDA_EDIT.itens.reduce((a,i)=>a+(Number(i.unit_cost)||0)*i.qty, 0);
const totalEdit = () => VENDA_EDIT.totalManual!=null ? VENDA_EDIT.totalManual : somaEdit();
const somaPagto = () => VENDA_EDIT.pagamentos.reduce((a,p)=>a+(Number(p.amount)||0), 0);

function telaEditarVenda(){
  const V = VENDA_EDIT;
  const total = totalEdit();
  const disp = PRODUCTS.filter(p=>p.active && !p.parent_id ? true : p.active)
    .sort((a,b)=>String(a.code||"").localeCompare(String(b.code||""),"pt-BR",{numeric:true}));
  openModal(`<h2>Editar venda</h2>
    <p class="mut small">#${V.id.slice(0,8)} — ajuste as quantidades, troque produtos e confirme o pagamento.</p>
    <div class="card" style="padding:8px 10px">
      ${V.itens.map((i,ix)=>`<div style="padding:7px 0;border-bottom:1px dashed var(--line)">
        <div class="row"><span style="flex:1;min-width:0;font-weight:700">${esc(i.product_name)}</span>
          <button class="qbtn" onclick="qtdItemVenda(${ix},-1)">−</button>
          <b class="num" style="min-width:22px;text-align:center">${i.qty}</b>
          <button class="qbtn" onclick="qtdItemVenda(${ix},1)">+</button>
          <b class="num" id="evSub${ix}" style="width:74px;text-align:right">${fmt(i.unit_price*i.qty)}</b>
        </div>
        <div class="row small mut" style="margin-top:3px">
          <span>preço unitário</span>
          <input inputmode="decimal" style="width:86px;margin:0 0 0 8px;padding:5px 7px;text-align:right"
            value="${Number(i.unit_price).toFixed(2).replace(".",",")}" oninput="mudarPrecoItem(${ix}, this.value)">
          <span class="right">custo ${fmt(i.unit_cost)}</span>
        </div>
      </div>`).join("") || `<p class="mut small">Nenhum item — adicione ao menos um.</p>`}
      <div class="row" style="padding-top:8px"><span class="mut small">Soma dos itens</span>
        <b class="right num" id="evSoma">${fmt(somaEdit())}</b></div>
    </div>

    <label>Adicionar produto</label>
    <div class="row" style="gap:8px">
      <select id="evProd" style="flex:1;margin:0">
        ${disp.map(p=>`<option value="${p.id}">${p.code?esc(p.code)+" · ":""}${esc(p.name)} — ${fmt(p.price)}</option>`).join("")}
      </select>
      <button class="btn" onclick="addItemVenda()">+</button>
    </div>

    <label>Valor total cobrado</label>
    <input id="evTotal" inputmode="decimal" value="${total.toFixed(2).replace(".",",")}" oninput="totalManualVenda()">
    <div id="evDif" class="mut small" style="margin:-4px 0 8px"></div>

    <label>Formas de pagamento</label>
    ${V.pagamentos.map((pg,ix)=>`<div class="row" style="gap:7px;margin-bottom:7px">
      <select style="flex:1;margin:0" onchange="mudarFormaPag(${ix}, this.value)">
        ${METHODS.map(([k,l])=>`<option value="${k}" ${pg.method===k?"selected":""}>${l}</option>`).join("")}
      </select>
      <input id="evPag${ix}" inputmode="decimal" style="width:100px;margin:0;text-align:right"
        value="${Number(pg.amount||0).toFixed(2).replace(".",",")}"
        oninput="mudarValorPag(${ix}, this.value)" onfocus="this.select()">
      ${V.pagamentos.length>1?`<button class="qbtn" onclick="removerPag(${ix})">✕</button>`:""}
    </div>`).join("")}
    <div class="row" style="gap:7px">
      <button class="btn small" onclick="addPag()">+ Outra forma</button>
      <button class="btn small ghost" onclick="ajustarPag()">Ajustar ao total</button>
      <span id="evStatus" class="right small" style="font-weight:800"></span>
    </div>

    <div id="evCalc" class="calcbox"></div>

    <label>Valor recebido do cliente (opcional)</label>
    <input id="evRecebido" inputmode="decimal" placeholder="deixe vazio se recebeu o valor exato"
      value="${V.recebido!=null?Number(V.recebido).toFixed(2).replace(".",","):""}" oninput="mudarRecebido(this.value)">
    <div id="evTroco" class="mut small" style="margin:-4px 0 8px">${trocoTxt()}</div>
    <div id="evClienteBox" style="display:${(V.recebido||0) > totalEdit()+0.004 ? "block":"none"}">
      <label>Nome do cliente (para lançar o crédito)</label>
      <input id="evCliente" value="${esc(V.cliente||"")}" placeholder="quem ficou com o crédito"
        oninput="VENDA_EDIT.cliente=this.value">
    </div>

    ${podeVer(2)?`<label>Data e hora da venda</label>
    <input id="evQuando" type="datetime-local" value="${dtLocal(V.quando)}">`:""}

    <label>Motivo da alteração</label>
    <input id="evMotivo" placeholder="ex.: trocou o terço pela pulseira e pagou a diferença">
    <div style="height:12px"></div>
    <button class="btn primary block" onclick="salvarEdicaoVenda()">Salvar alterações</button>`);
  atualizaResumoEdit();
}
/* Atualiza só os avisos, sem redesenhar o modal — se redesenhasse, o campo
   perderia o foco a cada tecla digitada. */
function atualizaResumoEdit(){
  if(!VENDA_EDIT) return;
  const total = totalEdit(), soma = somaEdit(), custo = custoEdit();
  const taxa = taxaPgtos(VENDA_EDIT.pagamentos), lucro = total - custo - taxa;
  const dif = $("evDif");
  if(dif) dif.innerHTML = Math.abs(soma-total)<0.005 ? "Igual à soma dos itens"
      : soma>total ? `<b>${fmt(soma-total)}</b> de desconto`
                   : `<b>${fmt(total-soma)}</b> acima da soma`;
  const st = $("evStatus");
  if(st){
    const p = somaPagto(), ok = Math.abs(p-total)<0.005;
    st.textContent = ok ? "confere" : (p<total ? `faltam ${fmt(total-p)}` : `sobra ${fmt(p-total)}`);
    st.style.color = ok ? "var(--ok)" : "var(--bad)";
  }
  const cx = $("evCalc");
  if(cx) cx.innerHTML = `Custo ${fmt(custo)}${taxa>0.004?` · taxas ${fmt(taxa)}`:""} ·
    <b style="color:${lucro<0?'var(--bad)':'var(--ok)'}">lucro ${fmt(lucro)}</b>`;
  const tr = $("evTroco"); if(tr) tr.innerHTML = trocoTxt();
  const cb = $("evClienteBox");
  if(cb) cb.style.display = (VENDA_EDIT.recebido||0) > total + 0.004 ? "block" : "none";
}
function qtdItemVenda(ix, d){
  const it = VENDA_EDIT.itens[ix]; if(!it) return;
  it.qty += d;
  if(it.qty<=0) VENDA_EDIT.itens.splice(ix,1);
  VENDA_EDIT.totalManual = null;      // volta a acompanhar a soma
  telaEditarVenda();
}
function addItemVenda(){
  const p = PRODUCTS.find(x=>x.id === $("evProd").value); if(!p) return;
  const ex = VENDA_EDIT.itens.find(i=>i.product_id===p.id);
  if(ex) ex.qty++;
  else VENDA_EDIT.itens.push({ product_id:p.id, product_name:p.name, qty:1,
                               unit_price:Number(p.price), unit_cost:Number(p.cost||0) });
  VENDA_EDIT.totalManual = null;
  telaEditarVenda();
}
function dtLocal(iso){
  const d = new Date(iso); const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function trocoTxt(){
  const r = VENDA_EDIT.recebido, t = totalEdit();
  if(r==null || r<=0) return "Sem troco a registrar.";
  const dif = Math.round((r-t)*100)/100;
  if(dif > 0.004) return `<b style="color:var(--ok)">Troco de ${fmt(dif)}</b> — se o cliente não levar, vira crédito no nome dele.`;
  if(dif < -0.004) return `<b style="color:var(--bad)">Faltam ${fmt(-dif)}</b> para fechar o total.`;
  return "Valor exato.";
}
function mudarPrecoItem(ix, v){
  const it = VENDA_EDIT.itens[ix]; if(!it) return;
  it.unit_price = N(v);
  VENDA_EDIT.totalManual = null;
  const sub = $("evSub"+ix); if(sub) sub.textContent = fmt(it.unit_price*it.qty);
  const soma = $("evSoma"); if(soma) soma.textContent = fmt(somaEdit());
  const tot = $("evTotal"); if(tot) tot.value = somaEdit().toFixed(2).replace(".",",");
  atualizaResumoEdit();
}
function mudarRecebido(v){
  VENDA_EDIT.recebido = v.trim()==="" ? null : N(v);
  const cx = $("evClienteBox");
  if(cx) cx.style.display = (VENDA_EDIT.recebido||0) > totalEdit()+0.004 ? "block" : "none";
  atualizaResumoEdit();
}
function totalManualVenda(){ VENDA_EDIT.totalManual = N($("evTotal").value); atualizaResumoEdit(); }
function mudarFormaPag(ix, m){ VENDA_EDIT.pagamentos[ix].method = m; atualizaResumoEdit(); }
function mudarValorPag(ix, v){ VENDA_EDIT.pagamentos[ix].amount = N(v); atualizaResumoEdit(); }
function removerPag(ix){ VENDA_EDIT.pagamentos.splice(ix,1); telaEditarVenda(); }
function addPag(){
  const falta = Math.max(0, Math.round((totalEdit() - somaPagto())*100)/100);
  const usados = VENDA_EDIT.pagamentos.map(p=>p.method);
  const novo = (METHODS.find(([k])=>!usados.includes(k))||["pix"])[0];
  VENDA_EDIT.pagamentos.push({ method:novo, amount:falta });
  telaEditarVenda();
}
/* Joga a diferença na última forma, para o total sempre fechar. */
function ajustarPag(){
  const P = VENDA_EDIT.pagamentos;
  if(!P.length) return;
  const outros = P.slice(0,-1).reduce((a,p)=>a+(Number(p.amount)||0),0);
  P[P.length-1].amount = Math.max(0, Math.round((totalEdit()-outros)*100)/100);
  telaEditarVenda();
}

async function salvarEdicaoVenda(){
  const V = VENDA_EDIT;
  if(!V.itens.length){ toast("A venda precisa de pelo menos um item"); return; }
  const motivo = ($("evMotivo").value||"").trim();
  if(!motivo){ toast("Descreva o motivo da alteração"); return; }
  const soma = somaEdit(), total = N($("evTotal").value) || soma;
  const fator = soma>0 ? total/soma : 1;
  const itens = V.itens.map(i=>{
    const bruto = i.unit_price*i.qty;
    const sub = Math.round(bruto*fator*100)/100;
    return { product_id:i.product_id, product_name:i.product_name, qty:i.qty,
             unit_price:i.unit_price, unit_cost:i.unit_cost, subtotal:sub,
             discount: Math.round((bruto-sub)*100)/100 };
  });
  const pagos = V.pagamentos.filter(p=>Number(p.amount)>0.004);
  if(!pagos.length){ toast("Informe ao menos uma forma de pagamento"); return; }
  const somaP = pagos.reduce((a,p)=>a+Number(p.amount),0);
  if(Math.abs(somaP-total) > 0.02){
    toast(`As formas somam ${fmt(somaP)} e o total é ${fmt(total)} — use "Ajustar ao total"`); return;
  }
  const corpo = {
    items: itens, total, gross: soma, discount: Math.max(0, Math.round((soma-total)*100)/100),
    payments: pagos.map(p=>({ method:p.method, amount:Number(p.amount) })),
    note: "editada: " + motivo };
  const qd = $("evQuando");
  if(qd && qd.value){
    const nova = new Date(qd.value);
    if(!isNaN(nova) && Math.abs(nova - new Date(V.quando)) > 60000) corpo.created_at = nova.toISOString();
  }
  const { error } = await sb.rpc("ep_editar_venda", { p_sale_id: V.id, p: corpo });
  if(error){ toast("Não foi possível salvar: "+error.message); return; }
  audit("venda_editada", { sale_id:V.id, total, motivo });
  const sobra = V.recebido!=null ? Math.round((V.recebido-total)*100)/100 : 0;
  if(sobra > 0.004){
    const nome = (V.cliente||"").trim();
    if(!nome){ toast("Venda salva. Informe o nome para lançar o crédito do troco."); }
    else {
      const r2 = await sb.rpc("ep_credito_mov", { p_event:EVENT.id, p_nome:nome, p_fone:null,
        p_delta:sobra, p_motivo:"Troco não devolvido (venda editada)", p_sale:V.id });
      if(r2.error) toast("Venda salva, mas o crédito falhou: "+r2.error.message);
      else toast(`Crédito de ${fmt(sobra)} para ${nome}`);
    }
  }
  VENDA_EDIT = null; closeModal(); toast("Venda atualizada");
  await loadProducts(); renderVendas();
}

/* Resumo de uma venda: o que saiu, quanto custou e quanto sobrou. */
function modalResumoVenda(sid){
  const s = (SALES_CACHE||[]).find(x=>x.id===sid); if(!s){ toast("Venda não encontrada"); return; }
  const itens = s.ep_sale_items||[];
  const custoDe = i => Number(i.unit_cost!=null ? i.unit_cost
                        : (PRODUCTS.find(p=>p.id===i.product_id)||{}).cost || 0) * i.qty;
  const custo = itens.reduce((a,i)=>a+custoDe(i),0);
  const bruto = Number(s.gross!=null ? s.gross : s.total);
  const desc  = Number(s.discount||0);
  const total = Number(s.total);
  const taxa = taxaPgtos(s.ep_sale_payments);
  const lucro = total - custo - taxa;
  openModal(`<h2>Resumo da venda</h2>
    <p class="mut small">#${s.id.slice(0,8)} · ${fdt(s.created_at)} · ${esc(window._pn(s.operator_id))}
      ${s.status!=="ok"?` · <span class="tag bad">${esc(s.status)}</span>`:""}</p>
    <div class="card" style="margin-bottom:10px">
      ${itens.map(i=>{
        const c = custoDe(i), sub = Number(i.subtotal), l = sub-c;
        return `<div style="padding:7px 0;border-bottom:1px dashed var(--line)">
          <div class="row small"><span>${i.qty}x ${esc(i.product_name)}
            ${Number(i.discount)>0.004?`<span class="descflag">−${fmt(i.discount)}</span>`:""}</span>
            <b class="right num">${fmt(sub)}</b></div>
          <div class="row small mut"><span>custo ${fmt(c)}</span>
            <b class="right num" style="color:${l<0?'var(--bad)':'var(--ok)'}">lucro ${fmt(l)}</b></div>
        </div>`;
      }).join("")}
    </div>
    <div class="card">
      <div class="row small" style="padding:3px 0"><span>Valor cheio</span><b class="right num">${fmt(bruto)}</b></div>
      ${desc>0.004?`<div class="row small" style="padding:3px 0"><span>Desconto ${(bruto?desc/bruto*100:0).toFixed(1).replace(".",",")}%
        ${s.discount_note?`<span class="mut">(${esc(s.discount_note)})</span>`:""}</span>
        <b class="right num" style="color:var(--bad)">−${fmt(desc)}</b></div>`:""}
      <div class="row" style="padding:3px 0"><b>Total pago</b><b class="right num">${fmt(total)}</b></div>
      <hr>
      <div class="row small" style="padding:3px 0"><span>Custo das mercadorias</span><b class="right num">${fmt(custo)}</b></div>
      ${taxa>0.004?`<div class="row small" style="padding:3px 0"><span>Taxa da maquininha</span>
        <b class="right num" style="color:var(--bad)">−${fmt(taxa)}</b></div>`:""}
      <div class="row"><b>${lucro<0?"Prejuízo":"Lucro"}</b>
        <b class="right num" style="font-size:18px;color:${lucro<0?'var(--bad)':'var(--ok)'}">${fmt(lucro)} · ${total>0?(lucro/total*100).toFixed(0):0}%</b></div>
      <div class="row small mut" style="padding-top:6px"><span>Pagamento</span>
        <span class="right">${(s.ep_sale_payments||[]).map(p=>`${mlabel(p.method)} ${fmt(p.amount)}`).join(" + ")}</span></div>
    </div>
    <div style="height:12px"></div>
    <button class="btn block" onclick="closeModal()">Fechar</button>`);
}
async function delVenda(sid,status){
  if(!confirm("Excluir esta venda em definitivo? Não dá pra desfazer.")) return;
  // O banco estorna o estoque e apaga a venda na mesma transação (sem depender
  // do estoque que esta tela tem em memória, que pode estar defasado).
  const { error } = await sb.rpc("ep_delete_sale", { p_sale_id: sid });
  if(error){ toast(error.message); return; }
  audit("venda_excluida",{sale_id:sid}); toast("Venda excluída"); await loadProducts(); renderVendas();
}
function modalCancelar(sid){
  openModal(`<h2>Cancelar venda</h2>
    <p class="mut small">Cancelamento exige autorização do Administrador Master e motivo obrigatório. O estoque é estornado.</p>
    <label>Motivo do cancelamento</label><textarea id="ccReason" rows="2"></textarea>
    <div style="height:12px"></div>
    <button class="btn danger block" onclick="cancelarVenda('${sid}')">Confirmar cancelamento</button>`);
}
async function cancelarVenda(sid){
  const reason=$("ccReason").value.trim();
  if(!reason){ toast("Motivo é obrigatório"); return; }
  const { error } = await sb.from("ep_sales").update({ status:"cancelada", cancel_reason:reason, canceled_by:ME.id, canceled_at:new Date().toISOString() }).eq("id",sid);
  if(error){ toast(error.message); return; }
  audit("venda_cancelada",{sale_id:sid,motivo:reason});
  closeModal(); toast("Venda cancelada e estoque estornado"); renderVendas();
}

function csv(rows, filename){
  const sep=";";
  const content = "\uFEFF" + rows.map(r=>r.map(c=>{
    const s=String(c??"").replace(/"/g,'""');
    return /[;"\n]/.test(s)?`"${s}"`:s;
  }).join(sep)).join("\r\n");
  const blob = new Blob([content],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename+".csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const money = v => (Number(v)||0).toFixed(2).replace(".", ",");
async function rel(tipo, formato){
  const eid=$("repEvent").value; if(!eid){ toast("Nenhum evento"); return; }
  const { data:ev } = await sb.from("ep_events").select("*").eq("id",eid).single();
  const D = await eventData(eid); const A = aggregate(D);
  audit("relatorio_gerado",{tipo,formato,event_id:eid});
  if(tipo==="consolidado"){ fechamentoGeral(eid); return; }
  if(tipo==="financeiro"){
    const lucroBruto=A.total-A.cmv, lucroLiq=lucroBruto-A.taxas-A.despesas, saidas=A.despesas+A.compras;
    const rows=[["Relatório financeiro",ev.name],[],["Item","Valor (R$)"],
      ["Total investido",money(ev.invested)],["Total faturado",money(A.total)],["CMV",money(A.cmv)],
      ["Lucro bruto",money(lucroBruto)],["Taxas de cartão",money(A.taxas)],["Despesas",money(A.despesas)],["Compras",money(A.compras)],
      ["Lucro líquido",money(lucroLiq)],["Entradas",money(A.total)],["Saídas",money(saidas)],
      ["Saldo final",money(A.total-saidas)],["Sangrias",money(A.totalSang)],[],
      ["Forma de pagamento","Valor"],...METHODS.map(([k,l])=>[l,money(A.by[k])])];
    if(formato==="xls"){ csv(rows,"financeiro-"+ev.name); return; }
    $("printArea").innerHTML = `<h1>Relatório financeiro — ${esc(ev.name)}</h1><p>${fd(Date.now())}</p>
      <table>${rows.slice(2).map(r=>r.length?`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`:"").join("")}</table>`;
    window.print(); return;
  }
  if(tipo==="operador"){
    const oid=$("repOp").value; const o=A.perOp[oid];
    const regs=D.regs.filter(r=>r.operator_id===oid);
    const sang=D.sang.filter(s=>regs.some(r=>r.id===s.register_id));
    $("printArea").innerHTML = `<h1>Relatório do operador — ${esc(A.pname(oid))}</h1><p>${esc(ev.name)} · ${fd(Date.now())}</p>
      <h2>Resumo</h2><table>
      <tr><td>Vendas</td><td>${o?o.n:0}</td></tr><tr><td>Total vendido</td><td>${fmt(o?o.total:0)}</td></tr>
      ${METHODS.map(([k,l])=>`<tr><td>${l}</td><td>${fmt(o?o.by[k]:0)}</td></tr>`).join("")}
      <tr><td>Sangrias</td><td>${fmt(sang.reduce((s,x)=>s+Number(x.amount),0))}</td></tr></table>
      <h2>Caixas</h2><table><tr><th>Abertura</th><th>Fundo</th><th>Fechamento</th><th>Esperado</th><th>Contado</th><th>Diferença</th><th>Justificativa</th></tr>
      ${regs.map(r=>`<tr><td>${fdt(r.opened_at)}</td><td>${fmt(r.opening_cash)}</td><td>${r.closed_at?fdt(r.closed_at):"aberto"}</td>
        <td>${r.expected_cash!=null?fmt(r.expected_cash):"—"}</td><td>${r.counted_cash!=null?fmt(r.counted_cash):"—"}</td>
        <td>${r.difference!=null?fmt(r.difference):"—"}</td><td>${esc(r.justification||"")}</td></tr>`).join("")}</table>
      <h2>Sangrias</h2><table><tr><th>Data/hora</th><th>Valor</th><th>Motivo</th><th>Responsável</th></tr>
      ${sang.map(s=>`<tr><td>${fd(s.created_at)}</td><td>${fmt(s.amount)}</td><td>${esc(s.reason)}</td><td>${esc(s.responsible)}</td></tr>`).join("")}</table>`;
    window.print(); return;
  }
  if(tipo==="estoque"){
    const rows=[["Estoque — "+ev.name],[],["Produto","Inicial","Vendidos","Perdidos","Consumo interno","Restante"]];
    const perdas=D.adjs.filter(a=>a.kind==="perda"), cons=D.adjs.filter(a=>a.kind==="consumo");
    D.prods.forEach(p=>{
      rows.push([p.name,p.stock_initial,(A.perProd[p.name]||{qty:0}).qty,
        perdas.filter(a=>a.product_id===p.id).reduce((s,a)=>s+a.qty,0),
        cons.filter(a=>a.product_id===p.id).reduce((s,a)=>s+a.qty,0), p.stock]);
    });
    csv(rows,"estoque-"+ev.name); return;
  }
  if(tipo==="compras"){
    const rows=[["Compras e despesas — "+ev.name],[],["Data","Tipo","Descrição","Valor (R$)"],
      ...D.exps.map(e=>[fd(e.created_at),e.kind,e.description,money(e.amount)])];
    csv(rows,"compras-"+ev.name); return;
  }
  if(tipo==="perdas"){
    const pn = id => (D.prods.find(p=>p.id===id)||{name:"?"}).name;
    const rows=[["Perdas e consumo interno — "+ev.name],[],["Data","Tipo","Produto","Qtd","Motivo"],
      ...D.adjs.filter(a=>a.kind==="perda"||a.kind==="consumo").map(a=>[fd(a.created_at),a.kind,pn(a.product_id),a.qty,a.reason||""])];
    csv(rows,"perdas-"+ev.name); return;
  }
  if(tipo==="lucro"){
    const rows=[["Lucro por produto — "+ev.name],[],["Produto","Qtd vendida","Faturamento (R$)","Custo (R$)","Lucro (R$)"],
      ...Object.values(A.perProd).sort((a,b)=>(b.total-b.cost)-(a.total-a.cost))
        .map(p=>[p.name,p.qty,money(p.total),money(p.cost),money(p.total-p.cost)])];
    csv(rows,"lucro-produto-"+ev.name); return;
  }
  if(tipo==="vendas"){
    const rows=[["Vendas — "+ev.name],[],["Código","Data/hora","Operador","Status","Total (R$)","Itens","Pagamentos"]];
    D.sales.forEach(s=>rows.push([s.id.slice(0,8),fd(s.created_at),A.pname(s.operator_id),s.status,money(s.total),
      (s.ep_sale_items||[]).map(i=>i.qty+"x "+i.product_name).join(" | "),
      (s.ep_sale_payments||[]).map(p=>mlabel(p.method)+" "+money(p.amount)).join(" | ")]));
    csv(rows,"vendas-"+ev.name); return;
  }
  if(tipo==="movimentacoes"){
    const { data:logs } = await sb.from("ep_audit").select("*").eq("event_id",eid).order("created_at",{ascending:false}).limit(2000);
    const pn = id => (D.profs.find(p=>p.id===id)||{name:"?"}).name;
    const rows=[["Movimentações do sistema — "+ev.name],[],["Data/hora","Usuário","Ação","Detalhes"],
      ...(logs||[]).map(l=>[fd(l.created_at),pn(l.user_id),l.action,JSON.stringify(l.details||{})])];
    csv(rows,"movimentacoes-"+ev.name); return;
  }
}
