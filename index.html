<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Financeiro — XV Encontro de Namorados</title>
<meta name="theme-color" content="#F4F0E6">
<style>
:root{
  --bg:#F4F0E6; --panel:#FCFAF4; --panel2:#EAE4D6; --line:#DCD4C2;
  --txt:#1B2A5E; --mut:#77798C; --brand:#B8912F; --brand-soft:#F1E8D0;
  --ok:#3F7A5A; --bad:#A4402F; --r:12px;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#FFFDF8;border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(184,145,47,.18)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
h1,h2,h3{margin:0 0 8px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--panel);border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:600;min-height:46px;color:var(--txt)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--txt);border-color:var(--txt);color:#FCFAF4;font-weight:700}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#FCFAF4}
.btn.ghost{background:transparent}
.btn.small{padding:7px 11px;min-height:34px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:hidden}
.kpi .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.kpi.warn .v{color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.amber{color:var(--brand);border-color:var(--brand)}
.mut{color:var(--mut)} .small{font-size:12.5px}
.right{margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
/* Shell */
#topbar{position:sticky;top:0;z-index:20;background:rgba(244,240,230,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:.02em}
.brand b{color:var(--brand)}
#nav{position:sticky;top:49px;z-index:19;display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:9px 12px;
  background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.navbtn{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--mut);
  border-radius:99px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px}
.navbtn.on{background:var(--txt);border-color:var(--txt);color:#FCFAF4}
main{max-width:1080px;margin:0 auto;padding:14px 14px 240px}
.view{display:none}.view.on{display:block}
/* Auth */
#authView{max-width:400px;margin:8vh auto;padding:0 16px}
.lockup{text-align:center;margin-bottom:20px}
.lockup .mark{width:56px;height:56px;border-radius:50%;background:var(--txt);color:var(--brand);
  display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;margin-bottom:12px;
  letter-spacing:.04em;border:2px solid var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.lockup .word{font-weight:800;letter-spacing:.16em;font-size:14px;text-transform:uppercase;line-height:1.6}
.lockup .stroke{width:40px;height:2px;background:var(--brand);border-radius:2px;margin:10px auto 0}
#verFooter{text-align:center;font-size:11px;color:var(--mut);letter-spacing:.06em;margin:22px 0 30px}
#verFooter b{color:var(--brand);font-weight:800}
.lockup .lema{font-size:13px;color:var(--brand);font-weight:700;letter-spacing:.03em;margin-top:10px}
/* PDV */
.pdvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cathead{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.cathead:first-child{margin-top:2px}
.cathead .ct{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--brand);white-space:nowrap}
.cathead .cl{flex:1;height:1px;background:var(--line)}
.hello{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.hello b{color:var(--brand)}
.hellosub{font-size:13px;color:var(--mut);margin-bottom:12px}
.livedot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--ok);margin-right:6px;vertical-align:middle}
.ordrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ordrow .on{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.arrow{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:800;color:var(--txt);flex:0 0 auto}
.arrow:disabled{opacity:.3;cursor:default}
.subnav{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subbtn{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--mut);
  border-radius:99px;padding:8px 15px;cursor:pointer;font-weight:700;font-size:13.5px}
.subbtn.on{background:var(--txt);border-color:var(--txt);color:#FCFAF4}
.subbtn .cnt{opacity:.7;font-weight:600}
.pcode{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--brand);
  background:var(--brand-soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
.pbtn .pcode{align-self:flex-start;margin-bottom:3px}
.codecell{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;white-space:nowrap}
.nofoto{border:1px dashed var(--bad);color:var(--bad);font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px}
.thumb.ph.falta{background:rgba(164,64,47,.08);border-color:var(--bad);color:var(--bad);font-size:10px}
.calcbox{background:var(--brand-soft);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;font-weight:700;margin-top:8px}
.pbtn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:0;overflow:hidden;
  cursor:pointer;text-align:left;display:flex;flex-direction:column;color:var(--txt)}
.pbtn:active{transform:scale(.97);border-color:var(--brand)}
.pbtn .pbody{padding:11px 12px 13px;display:flex;flex-direction:column;gap:2px}
.pbtn .pn{font-weight:700;line-height:1.25}
.pbtn .pp{color:var(--brand);font-weight:800;margin-top:4px}
.pbtn .ps{font-size:11px;color:var(--mut)}
.pbtn.low .ps{color:var(--bad);font-weight:700}
.pbtn.out{opacity:.45;pointer-events:none}
.pimg{width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;display:block;background:var(--panel2);border-bottom:1px solid var(--line)}
.pimg.ph{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--mut);
  background:var(--brand-soft);letter-spacing:.02em}
.thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--panel2);border:1px solid var(--line);display:block}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--mut);background:var(--brand-soft);font-size:15px}
#cartBar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);max-height:76vh;overflow:hidden;
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#cartBar .inner{max-width:1080px;margin:0 auto}
.payrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.paybtn{border:1px solid var(--line);background:#FFFDF8;border-radius:9px;padding:9px 4px;cursor:pointer;
  font-size:12px;font-weight:700;text-align:center;color:var(--txt)}
.paybtn.on{background:var(--txt);border-color:var(--txt);color:#FCFAF4}
.pixpane{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:10px;margin:8px 0;display:flex;gap:12px;align-items:center}
.pixpane .qr{width:132px;height:132px;flex:0 0 auto;background:#fff;border-radius:9px;padding:6px;
  border:1px solid var(--line)}
.pixpane .qr img{width:100%;height:100%;display:block}
.pixpane .txt{flex:1;min-width:0}
.pixpane .vl{font-size:23px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pixpane .lb{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.pixpane .hint{font-size:11.5px;color:var(--mut);line-height:1.45;margin-top:5px}
.pixfull{text-align:center}
.pixfull img{width:100%;max-width:340px;background:#fff;border-radius:12px;padding:10px;border:1px solid var(--line)}
.descgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 14px}
.descbtn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:11px 4px;
  font-weight:800;font-size:13px;color:var(--txt);cursor:pointer}
.descbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.descflag{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--bad);
  border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle}
.resumovenda{border-top:1px solid var(--line);padding:8px 0 4px;margin-top:4px}
.resumovenda .rv{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.resumovenda .rv span{flex:1}
.resumovenda .rv b{font-variant-numeric:tabular-nums}
.resumovenda .desc b{color:var(--bad)}
.resumovenda .lucro b{color:var(--ok)}
.resumovenda .prej{color:var(--bad);font-weight:800}
.cartlist{max-height:26vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.cartlist.rolando{border-bottom:1px solid var(--line)}
.carttoggle{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;
  padding:8px 2px;cursor:pointer;color:var(--txt);text-align:left;font:inherit}
.carttoggle .seta{width:22px;height:22px;flex:0 0 auto;border-radius:6px;background:var(--panel2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
.carttoggle .resumo{flex:1;min-width:0;font-size:12.5px;font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carttoggle .valor{font-variant-numeric:tabular-nums;font-weight:800;color:var(--brand)}
.carthead{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--mut);padding:2px 0 6px}
.cartline{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.qbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:800;color:var(--txt)}
#totalBig{font-size:26px;font-weight:900;letter-spacing:-.02em}
/* Modal */
#modalWrap{position:fixed;inset:0;z-index:50;background:rgba(27,42,94,.42);display:none;align-items:flex-end;justify-content:center}
#modalWrap.on{display:flex}
#modalBox{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;
  max-height:88vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){#modalWrap{align-items:center}#modalBox{border-radius:16px}}
.diffbad{background:rgba(164,64,47,.1);border:1px solid var(--bad);border-radius:10px;padding:10px;color:var(--bad);font-weight:800}
.diffok{background:rgba(63,122,90,.1);border:1px solid var(--ok);border-radius:10px;padding:10px;color:var(--ok);font-weight:800}
/* Uploader de imagem */
.imgpick{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:var(--r);padding:12px;background:#FFFDF8}
.imgpick .prev{width:78px;height:78px;border-radius:10px;object-fit:cover;flex:0 0 auto;border:1px solid var(--line);background:var(--panel2)}
.imgpick .prev.ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;text-align:center;padding:6px;background:var(--brand-soft)}
/* Toast / offline */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:60;background:var(--txt);color:#FCFAF4;
  border-radius:10px;padding:11px 16px;font-weight:600;display:none;max-width:90vw}
#toast .btn{background:transparent;border-color:rgba(252,250,244,.4);color:#FCFAF4}
#offlineBar{display:none;background:var(--bad);color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:5px}
#offlineBar.on{display:block}
.alertline{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13.5px}
.alertline.bad{border-color:var(--bad)}
.alertline.amber{border-color:var(--brand)}
/* Print */
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;color:#000;background:#fff;font-size:12px}
  #printArea h1{font-size:18px} #printArea h2{font-size:14px;margin-top:14px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #999;padding:4px 6px;text-align:left;color:#000}
}
/* ---------- RELATÓRIO FINAL (tela + impressão) ---------- */
#relFinal{display:none;position:fixed;inset:0;z-index:200;background:#6B6F80;overflow-y:auto;-webkit-overflow-scrolling:touch}
#relTop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;justify-content:space-between;
  background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px}
#relPaper{max-width:820px;margin:0 auto;padding:14px 10px 60px}
#relPaper .pg{background:#fff;color:#1B1D24;border-radius:10px;padding:26px 24px;margin-bottom:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.18)}
#relPaper h1{font-size:30px;line-height:1.1;margin:0 0 4px;color:#1B2A5E;letter-spacing:-.02em}
#relPaper h2{font-size:17px;margin:0 0 14px;color:#1B2A5E;border-bottom:2px solid #B8912F;padding-bottom:6px}
#relPaper h3{font-size:13px;margin:16px 0 8px;color:#1B2A5E;text-transform:uppercase;letter-spacing:.06em}
#relPaper .mut2{color:#8A8FA6}
#relPaper .nota{font-size:11.5px;color:#5C6070;line-height:1.5;margin:10px 0 0;background:#F7F5EF;
  border-left:3px solid #B8912F;padding:8px 10px;border-radius:0 6px 6px 0}
#relPaper table.tb{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
#relPaper table.tb th{background:#1B2A5E;color:#fff;text-align:left;padding:6px 7px;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.04em;font-weight:700}
#relPaper table.tb td{border-bottom:1px solid #EDE9DE;padding:6px 7px}
#relPaper table.tb.sm{font-size:10.5px}
#relPaper table.tb .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#relPaper table.tb tr.tot td{border-top:2px solid #1B2A5E;background:#F7F5EF}
#relPaper table.tb tr.sub td{background:#FAF8F3}
#relPaper table.tb tr.hl td{background:#FBF3DC}
#relPaper .ok2{color:#3F7A5A;font-weight:700}
#relPaper .bad2{color:#A4402F;font-weight:700}
#relPaper .kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
#relPaper .k{background:#F7F5EF;border:1px solid #EDE9DE;border-radius:8px;padding:10px}
#relPaper .k span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#6B6F80}
#relPaper .k b{display:block;font-size:19px;color:#1B2A5E;margin-top:2px;letter-spacing:-.01em}
#relPaper .dois{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#relPaper .dois>table{flex:1;min-width:240px}
#relPaper .dois2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#relPaper .dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px}
#relPaper .rk{margin:6px 0}
#relPaper .rkrow{display:flex;gap:9px;align-items:center;margin:7px 0}
#relPaper .rkpos{width:19px;height:19px;border-radius:5px;background:#1B2A5E;color:#fff;font-size:10px;
  font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#relPaper .rkbody{flex:1;min-width:0}
#relPaper .rkline{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin-bottom:3px}
#relPaper .rkname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#relPaper .rkval{font-variant-numeric:tabular-nums;white-space:nowrap}
#relPaper .rktrack{height:7px;background:#EDE9DE;border-radius:99px;overflow:hidden}
#relPaper .rkfill{height:100%;border-radius:99px}
#relPaper .rec{font-size:12px;line-height:1.5;padding:9px 11px;border-radius:8px;margin:7px 0;
  background:#F7F5EF;border-left:4px solid #8A8FA6}
#relPaper .rec-faltou{border-left-color:#A4402F;background:#FBEFEC}
#relPaper .rec-quase{border-left-color:#B8912F;background:#FBF3DC}
#relPaper .rec-sobrou{border-left-color:#1B2A5E;background:#F1F3F9}
#relPaper .rec-margem{border-left-color:#B8912F}
#relPaper .rec-zero{border-left-color:#A4402F}
#relPaper .rec-pico,#relPaper .rec-pgto,#relPaper .rec-troco{border-left-color:#3F7A5A;background:#EFF5F1}
/* capa */
#relPaper .capa{text-align:center;padding:46px 30px}
#relPaper .capa .selo{width:64px;height:64px;border-radius:99px;background:#1B2A5E;color:#B8912F;
  font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
#relPaper .capa .sub{font-size:13px;color:#6B6F80;margin-bottom:20px}
#relPaper .capa .titulo{font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#B8912F}
#relPaper .capa .linha{height:2px;background:#B8912F;width:70px;margin:16px auto 22px}
#relPaper .capa table.meta{width:100%;max-width:420px;margin:0 auto;font-size:12px;border-collapse:collapse;text-align:left}
#relPaper .capa table.meta td{padding:5px 4px;border-bottom:1px solid #EDE9DE}
#relPaper .capa table.meta td:first-child{color:#6B6F80}
#relPaper .capa table.meta td:last-child{text-align:right;font-weight:600}
#relPaper .capa .resumocapa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px auto 0;max-width:460px}
#relPaper .capa .resumocapa div{background:#1B2A5E;color:#fff;border-radius:8px;padding:12px 8px}
#relPaper .capa .resumocapa span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
#relPaper .capa .resumocapa b{display:block;font-size:16px;margin-top:3px}
#relPaper .assinaturas{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:44px;text-align:center}
#relPaper .assinaturas .ass{border-top:1px solid #1B1D24;margin-bottom:6px}
#relPaper .assinaturas span{font-size:11px;color:#6B6F80}
#relPaper .rodape{text-align:center;font-size:10px;color:#8A8FA6;margin-top:26px}
@media (max-width:640px){
  #relPaper .kgrid{grid-template-columns:repeat(2,1fr)}
  #relPaper .dois2{grid-template-columns:1fr}
  #relPaper .pg{padding:18px 14px}
}
@media print{
  body.printrel>*{display:none!important}
  body.printrel #relFinal{display:block!important;position:static;background:#fff;overflow:visible}
  body.printrel #relTop{display:none!important}
  body.printrel #relPaper{max-width:none;padding:0}
  body.printrel #relPaper .pg{box-shadow:none;border-radius:0;margin:0;padding:0 0 10mm;
    page-break-after:always;break-after:page}
  body.printrel #relPaper .pg:last-child{page-break-after:auto;break-after:auto}
  body.printrel #relPaper table,body.printrel #relPaper .rec,body.printrel #relPaper .nota{page-break-inside:avoid}
  body.printrel #relPaper tr{page-break-inside:avoid}
  body.printrel *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@page{size:A4;margin:14mm 12mm}

/* Hero + gráficos */
.hero{background:var(--panel);border-color:var(--line)}
.hero-v{font-size:34px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px;vertical-align:middle}
svg text{font-family:inherit}
/* Mobile */
@media(max-width:560px){
  #topbar{gap:8px;padding:9px 12px}
  .brand{font-size:15px;line-height:1.15}
  #topbar #topEvent{display:none}
  #topUser{font-size:11px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:12px 12px 240px}
  .grid2,.grid3{grid-template-columns:1fr}
  h2{font-size:20px}
  #totalBig{font-size:22px}
  .hero-v{font-size:30px}
  .kpi .v{font-size:18px}
  .pdvgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Taxa cobrada pela maquininha, descontada do lucro (o cliente paga o valor cheio,
   mas parte fica com a operadora do cartão). */
const TAXAS = { dinheiro:0, pix:0, debito:2.79, credito:5.99, credito_loja:0, outro:0 };
const taxaDe = (metodo, valor) => Number(valor||0) * (TAXAS[metodo]||0)/100;
const taxaPgtos = pgtos => (pgtos||[]).reduce((s,p)=>s+taxaDe(p.method, p.amount), 0);
const METHODS = [["dinheiro","Dinheiro"],["pix","Pix"],["debito","Débito"],["credito","Crédito"],["credito_loja","Crédito cliente"],["outro","Outro"]];
const mlabel = m => (METHODS.find(x=>x[0]===m)||["","?"])[1];
const inicial = n => String(n||"?").trim().charAt(0).toUpperCase();
/* Níveis de acesso, do menor para o maior. O número decide o que cada um enxerga. */
const NIVEIS = [
  ["operador",  "Operador",     1, "Vende e cuida do próprio caixa."],
  ["supervisor","Supervisor",   2, "Tudo do operador + produtos, estoque, preços e vendas."],
  ["admin",     "Administrador",3, "Tudo do supervisor + painel ao vivo e relatórios."],
  ["master",    "Admin Master", 4, "Acesso total, incluindo usuários, níveis e auditoria."]
];
const nivelNum = r => (NIVEIS.find(n=>n[0]===r)||NIVEIS[0])[2];
const nivelNome = r => (NIVEIS.find(n=>n[0]===r)||NIVEIS[0])[1];
const meuNivel = () => nivelNum(ME?.role);
const podeVer = n => meuNivel() >= n;
const isAdmin = () => podeVer(3);
const isMaster = () => meuNivel() === 4;
const primeiroNome = n => String(n||"").trim().split(/\s+/)[0] || "";

/* ---------- AUTH ---------- */
function toggleBootstrap(on){ $("loginForm").style.display=on?"none":"block"; $("bootForm").style.display=on?"block":"none"; $("authMsg").textContent=""; }
async function doLogin(){
  $("authMsg").textContent="";
  const { error } = await sb.auth.signInWithPassword({ email:$("loginEmail").value.trim(), password:$("loginPass").value });
  if(error){ $("authMsg").textContent = "Falha no login: " + error.message; return; }
  boot();
}
async function doBootstrap(){
  $("authMsg").textContent="";
  const email=$("bootEmail").value.trim(), pass=$("bootPass").value, name=$("bootName").value.trim();
  const { error } = await sb.rpc("ep_bootstrap_admin",{ p_email:email, p_password:pass, p_name:name });
  if(error){ $("authMsg").textContent = error.message; return; }
  const r = await sb.auth.signInWithPassword({ email, password:pass });
  if(r.error){ $("authMsg").textContent = r.error.message; return; }
  boot();
}
async function doLogout(){ try{ if(RT) sb.removeChannel(RT); }catch(e){} await sb.auth.signOut(); location.reload(); }
/* Se a sessão expirar no meio do evento, o app volta para o login em vez de
   falhar silenciosamente com telas vazias. */
sb.auth.onAuthStateChange((evt, session)=>{
  if(evt==="SIGNED_OUT" || (evt==="TOKEN_REFRESHED" && !session)){ location.reload(); }
  if(session){ try{ sb.realtime.setAuth(session.access_token); }catch(e){} }
});

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("authView").style.display="block"; $("app").style.display="none"; return; }
  const { data:prof, error } = await sb.from("ep_profiles").select("*").eq("id",session.user.id).single();
  if(error || !prof || !prof.active){
    $("authMsg").textContent = "Conta sem acesso ao sistema ou desativada.";
    await sb.auth.signOut(); return;
  }
  ME = prof;
  $("authView").style.display="none"; $("app").style.display="block";
  $("topUser").textContent = ME.name + " · " + nivelNome(ME.role);
  try{ sb.realtime.setAuth(session.access_token); }catch(e){}
  await loadEvent();
  iniciarRealtime();
  buildNav();
  go(isAdmin() ? "painel" : "pdv");
  syncQueue();
}

const EVENT_NAME = "XV Encontro de Namorados";
async function loadEvent(){
  let { data } = await sb.from("ep_events").select("*").eq("status","aberto").order("created_at",{ascending:false}).limit(1);
  EVENT = (data && data[0]) || null;
  // App dedicado a um único evento: se o admin entrar e não houver evento, cria automaticamente.
  if(!EVENT && ME && isAdmin()){
    const ins = await sb.from("ep_events").insert({ name:EVENT_NAME, created_by:ME.id }).select("*").single();
    if(!ins.error) EVENT = ins.data;
  }
  $("topEvent").textContent = EVENT ? "Ativo" : "Sem evento";
  if(EVENT){
    await loadCategories();
    await loadProducts();
    const { data:regs } = await sb.from("ep_registers").select("*").eq("event_id",EVENT.id).eq("operator_id",ME.id).eq("status","aberto").limit(1);
    REG = (regs && regs[0]) || null;
  } else { REG=null; PRODUCTS=[]; CATEGORIES=[]; }
}
async function loadProducts(){
  if(!EVENT) return;
  const { data } = await sb.from("ep_products").select("*").eq("event_id",EVENT.id).order("sort_order",{ascending:true}).order("name",{ascending:true});
  if(data){ PRODUCTS = data; localStorage.setItem("ep_products_"+EVENT.id, JSON.stringify(data)); }
  else { PRODUCTS = JSON.parse(localStorage.getItem("ep_products_"+EVENT.id)||"[]"); }
}
async function loadCategories(){
  if(!EVENT) return;
  const { data } = await sb.from("ep_categories").select("*").eq("event_id",EVENT.id).order("sort_order",{ascending:true}).order("name",{ascending:true});
  if(data){ CATEGORIES = data; localStorage.setItem("ep_cats_"+EVENT.id, JSON.stringify(data)); }
  else { CATEGORIES = JSON.parse(localStorage.getItem("ep_cats_"+EVENT.id)||"[]"); }
}
const catName = id => (CATEGORIES.find(c=>c.id===id)||{}).name || null;
/* Categorias de peça única (itens religiosos) não são repostas durante o evento,
   então avisar "estoque baixo" nelas só gera ruído. O aviso é ligado por categoria. */
const alertaAtivo = p => {
  const c = CATEGORIES.find(c=>c.id===p.category_id);
  return c ? c.alerta_estoque !== false : true;
};
/* Agrupa produtos pelas categorias, na ordem definida pelo admin.
   Produtos sem categoria vão para um grupo "Outros" no fim. */
function groupByCat(list){
  const ord = p => Number(p.sort_order)||0;
  const groups = CATEGORIES.map(c=>({ id:c.id, name:c.name, items:list.filter(p=>p.category_id===c.id).sort((a,b)=>ord(a)-ord(b)) }));
  const soltos = list.filter(p=>!p.category_id || !CATEGORIES.some(c=>c.id===p.category_id)).sort((a,b)=>ord(a)-ord(b));
  if(soltos.length) groups.push({ id:null, name: CATEGORIES.length ? "Outros" : null, items:soltos });
  return groups.filter(g=>g.items.length);
}

}

/* ---------- IMAGENS DE PRODUTO ----------
   O caminho antigo assumia comportamentos que só valem no Safari/desktop e quebrava
   no Android: arquivo sem MIME type vindo da Galeria/Google Fotos, ausência de
   crypto.randomUUID em WebViews antigas, falha de canvas.toBlob e blob: URL
   recusada por alguns navegadores. Aqui cada etapa tem alternativa. */

/* Identificador único com alternativa para navegadores sem crypto.randomUUID */
function uid(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  const b = new Uint8Array(16);
  try{ crypto.getRandomValues(b); }
  catch(e){ for(let i=0;i<16;i++) b[i] = Math.floor(Math.random()*256); }
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2,"0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

const EXT_IMG = /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)$/i;
function pareceImagem(f){
  const t = String(f.type||"");
  if(t.startsWith("image/")) return true;
  if(!t && EXT_IMG.test(f.name||"")) return true;   // Android às vezes manda type vazio
  return EXT_IMG.test(f.name||"");
}
function lerDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(new Error("Não foi possível ler o arquivo"));
    r.readAsDataURL(file);
  });
}
function carregarImg(src){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>res(img);
    img.onerror = ()=>rej(new Error("decode"));
    try{ img.crossOrigin = "anonymous"; }catch(e){}
    img.src = src;
  });
}
/* Três tentativas de decodificar: createImageBitmap (melhor no Android),
   blob: URL e, por fim, data: URL. */
async function decodificarImagem(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file); }catch(e){}
  }
  let url = null;
  try{
    url = URL.createObjectURL(file);
    const im = await carregarImg(url);
    return im;
  }catch(e){}
  finally{ if(url) setTimeout(()=>URL.revokeObjectURL(url), 4000); }
  try{
    return await carregarImg(await lerDataURL(file));
  }catch(e){
    throw new Error("formato não suportado por este navegador (HEIC do iPhone costuma dar isso — envie como JPG)");
  }
}
async function canvasParaBlob(c, q){
  if(c.toBlob){
    const b = await new Promise(r=>{ try{ c.toBlob(r, "image/jpeg", q); }catch(e){ r(null); } });
    if(b) return b;
  }
  // alternativa para navegadores sem toBlob
  const d = c.toDataURL("image/jpeg", q);
  const bin = atob(d.split(",")[1]);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:"image/jpeg" });
}
async function compressImg(file, max=900, quality=.82){
  if(!file) throw new Error("Nenhum arquivo selecionado");
  if(!pareceImagem(file)) throw new Error("Esse arquivo não parece ser uma imagem");
  const im = await decodificarImagem(file);
  const W = im.width || im.naturalWidth, H = im.height || im.naturalHeight;
  if(!W || !H) throw new Error("Imagem sem dimensões válidas");
  let alvo = max, blob = null;
  // celulares antigos podem não dar conta de um canvas grande: vai reduzindo
  for(const tentativa of [alvo, 700, 500, 360]){
    try{
      const s = Math.min(1, tentativa/Math.max(W,H));
      const w = Math.max(1, Math.round(W*s)), h = Math.max(1, Math.round(H*s));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(im, 0, 0, w, h);
      blob = await canvasParaBlob(c, quality);
      if(blob && blob.size <= 4.5*1024*1024) break;   // limite do servidor é 5 MB
    }catch(e){ blob = null; }
  }
  try{ if(im.close) im.close(); }catch(e){}
  if(!blob) throw new Error("não foi possível processar a imagem neste aparelho");
  return blob;
}
async function uploadProdImg(file, onStatus){
  const st = onStatus || (()=>{});
  st("Preparando a imagem…");
  const blob = await compressImg(file);
  st(`Enviando ${(blob.size/1024).toFixed(0)} KB…`);
  const path = `${EVENT.id}/${uid()}.jpg`;
  const { error } = await sb.storage.from(IMG_BUCKET)
    .upload(path, blob, { contentType:"image/jpeg", cacheControl:"31536000", upsert:false });
  if(error){
    const m = String(error.message||"");
    if(/row-level security|Unauthorized|403/i.test(m)) throw new Error("seu nível de acesso não permite enviar fotos");
    if(/exceeded|too large|413/i.test(m)) throw new Error("a imagem ficou grande demais");
    if(/mime|content type/i.test(m)) throw new Error("formato recusado pelo servidor");
    if(/Failed to fetch|Load failed|network/i.test(m)) throw new Error("falha de conexão ao enviar — tente de novo");
    throw new Error(m || "falha no envio");
  }
  return sb.storage.from(IMG_BUCKET).getPublicUrl(path).data.publicUrl;
}

function desenharGradePDV(){
  const grid = $("pdvGrid"); if(!grid) return;
  const q = PDV_BUSCA.trim().toLowerCase();
  const cardHTML = p => {
    const nCores = filhosDe(p.id).length;
    const est = estoqueTotal(p);
    const low = alertaAtivo(p) && est<=p.min_stock, out = est<=0;
    return `<button class="pbtn ${low?'low':''} ${out?'out':''}" onclick="${nCores?`modalCores('${p.id}')`:`addCart('${p.id}')`}">
      ${prodImgHTML(p)}

        ${p.code?`<span class="pcode">${esc(p.code)}</span>`:""}
        <span class="pn">${esc(p.name)}</span>

        <span class="ps num">${nCores?`${nCores} cores · ${est} un`:`estoque ${est}`}</span>
      </span>
    </button>`;
  };
  // Só produtos-raiz na grade: as cores aparecem ao tocar no produto.
  let lista = PRODUCTS.filter(p=>p.active && !p.parent_id);
  if(q){
    const bate = p => String(p.name||"").toLowerCase().includes(q) || String(p.code||"").toLowerCase().includes(q);
    // Buscar pelo código de uma cor (EB-249.2) traz o produto principal dela.
    const paisPorFilho = new Set(PRODUCTS.filter(p=>p.parent_id && bate(p)).map(p=>p.parent_id));
    lista = lista.filter(p=> bate(p) || paisPorFilho.has(p.id));
  }

  let grupos = groupByCat(lista);
  // Numa categoria específica (e sem busca), mostra só ela e sem cabeçalho repetido.
  if(PDV_CAT !== "todas" && !q){
    grupos = grupos.filter(g=>(g.id||"outros") === PDV_CAT).map(g=>({...g, name:null}));
  }

  grid.innerHTML = grupos.map(g=>
    `${g.name?`<div class="cathead"><span class="ct">${esc(g.name)}</span><span class="cl"></span></div>`:""}
     <div class="pdvgrid">${g.items.map(cardHTML).join("")}</div>`
  ).join("") || `<div class="card mut">${q?"Nenhum produto encontrado para essa busca.":"Nenhum produto nesta categoria."}</div>`;
  agendaEspacoCarrinho();
}
function addCart(pid){

function decCart(pid){ if(!CART[pid])return; CART[pid]--; if(CART[pid]<=0) delete CART[pid]; renderCart(); }
/* ---------- DESCONTOS ----------
   DESC_ITEM guarda o % de desconto de cada produto; DESC_GERAL o % aplicado
   sobre o total. Os dois podem coexistir: o geral incide sobre o que sobrou
   depois dos descontos por item. */
let DESC_ITEM = {}, DESC_GERAL = 0;
/* Kit: um preço fechado para o conjunto do carrinho. A diferença em relação à
   soma dos itens é tratada como desconto e rateada entre eles ao gravar, para o
   relatório por produto continuar correto. */
let KIT = null;   // { nome, preco }

const precoItem = (p,q) => Number(p.price)*q;
function descontoItem(pid){ return Number(DESC_ITEM[pid]||0); }
function linhaCarrinho(pid,q){
  const p = PRODUCTS.find(x=>x.id===pid);
  if(!p) return null;
  const bruto = precoItem(p,q);
  const d = bruto * descontoItem(pid)/100;
  return { p, q, bruto, desc:d, liquido:bruto-d, custo:Number(p.cost||0)*q };
}
function resumoCarrinho(){
  const linhas = Object.entries(CART).map(([pid,q])=>linhaCarrinho(pid,q)).filter(Boolean);
  const bruto = linhas.reduce((s,l)=>s+l.bruto,0);
  const descItens = linhas.reduce((s,l)=>s+l.desc,0);
  const aposItens = bruto - descItens;
  let descGeral = aposItens * (Number(DESC_GERAL)||0)/100;
  let total = Math.max(0, aposItens - descGeral);
  if(KIT && linhas.length){                    // preço fechado manda no total
    total = Math.max(0, Number(KIT.preco)||0);
    descGeral = Math.max(0, aposItens - total);
  }
  const custo = linhas.reduce((s,l)=>s+l.custo,0);
  const descTotal = descItens + descGeral;
  const fatorRateio = (bruto - descItens) > 0 ? total/(bruto - descItens) : 1;
  return { linhas, bruto, descItens, descGeral, descTotal, total, custo, fatorRateio,
           lucro: total - custo,
           margem: total>0 ? (total-custo)/total*100 : 0,
           pctTotal: bruto>0 ? descTotal/bruto*100 : 0 };
}
function cartTotal(){ return resumoCarrinho().total; }

function setDesconto(pid, pct){
  pct = Math.max(0, Math.min(100, Number(pct)||0));

  else DESC_GERAL = pct;

function descontoPorValor(pid){
  const v = N($("descVal").value);

let _ESPACO = -1;
function ajustaEspacoCarrinho(){
  const bar = $("cartBar"), m = document.querySelector("main");
  if(!bar || !m) return;
  const vis = getComputedStyle(bar).display !== "none";
  const h = vis ? Math.ceil(bar.getBoundingClientRect().height) : 0;
  const t = $("toast"); if(t) t.style.bottom = (h + 16) + "px";
  const pad = h + 24;
  if(pad === _ESPACO) return;
  _ESPACO = pad;
  m.style.paddingBottom = pad + "px";
}

async function concluirVenda(){
  const total = cartTotal();
  if(!PAY || total<=0) return;
  if(PAY==="credito_loja"){
    if(!CRED_CLIENTE){ modalEscolherCredito(); return; }
    if(saldoDe(CRED_CLIENTE)+0.004 < total){ toast("Saldo insuficiente"); return; }
  }

  await saveSale([{method:PAY, amount:total}]);
  if(PAY==="credito_loja" && cliente){
    const { error } = await sb.rpc("ep_credito_mov", { p_event:EVENT.id, p_nome:cliente,
      p_fone:null, p_delta:-total, p_motivo:"Compra no evento", p_sale:null });

let SALVANDO = false;
async function saveSale(payments){
  if(SALVANDO) return;              // impede duas vendas por duplo toque
  SALVANDO = true;
  try{ await _saveSale(payments); } finally { SALVANDO = false; renderCart(); }
}
async function _saveSale(payments){
  const R = resumoCarrinho();
  // o desconto geral é rateado entre os itens, para o relatório por produto ficar correto
  const fator = R.fatorRateio;
  const items = R.linhas.map(l=>({
    product_id: l.p.id, product_name: l.p.name, qty: l.q,
    unit_price: Number(l.p.price), unit_cost: Number(l.p.cost||0),
    subtotal: Math.round(l.liquido*fator*100)/100,
    discount: Math.round((l.bruto - l.liquido*fator)*100)/100
  }));
  const total = R.total;
  const nota = [KIT?`${KIT.nome} por ${fmt(KIT.preco)}`:null,
                R.descItens>0.004?`itens: ${fmt(R.descItens)}`:null,
                (!KIT && R.descGeral>0.004)?`geral ${DESC_GERAL}%: ${fmt(R.descGeral)}`:null].filter(Boolean).join(" · ");
  const sale = { offline_id: uid(), event_id:EVENT.id, register_id:REG.id, operator_id:ME.id,
    total, gross:R.bruto, discount:R.descTotal, discount_note: nota||null,
    custo:R.custo, items, payments, created_at:new Date().toISOString() };
  items.forEach(i=>{ const p=PRODUCTS.find(x=>x.id===i.product_id); if(p) p.stock-=i.qty; });
  CART={}; PAY=null; DESC_ITEM={}; DESC_GERAL=0; KIT=null; CART_ABERTO=false; renderPDV();
  if(!navigator.onLine){ queueSale(sale); toast("Venda salva OFFLINE — será sincronizada"); return; }
  const ok = await pushSale(sale);
  if(ok){ LAST_SALE=sale; toast("Venda concluída — "+fmt(total)); showReceiptOffer(sale); }
  else { queueSale(sale); toast("Sem conexão — venda guardada para sincronizar"); }
}
/* Grava a venda inteira (cabeçalho + itens + pagamentos) em UMA transação no banco.
   Se a rede cair no meio, nada é gravado pela metade. E se a mesma venda for
   reenviada pela fila offline, o banco reconhece o offline_id e não duplica. */
async function pushSale(s){
  try{
    const { data, error } = await sb.rpc("ep_push_sale", { p: {
      offline_id:s.offline_id, event_id:s.event_id, register_id:s.register_id,
      operator_id:s.operator_id, total:s.total, gross:s.gross, discount:s.discount,
      discount_note:s.discount_note, created_at:s.created_at,
      items:s.items, payments:s.payments
    }});
    if(error) return false;
    audit("venda", { sale_id:data, total:s.total });
    return true;
  }catch(e){ return false; }
}
function queueSale(s){ const q=JSON.parse(localStorage.getItem("ep_queue")||"[]"); q.push(s); localStorage.setItem("ep_queue",JSON.stringify(q)); }
async function syncQueue(){
  if(!navigator.onLine) return;
  let q=JSON.parse(localStorage.getItem("ep_queue")||"[]");
  if(!q.length) return;
  const rest=[];
  for(const s of q){ if(!(await pushSale(s))) rest.push(s); }
  localStorage.setItem("ep_queue",JSON.stringify(rest));
  if(q.length!==rest.length) toast(`${q.length-rest.length} venda(s) offline sincronizada(s)`);
}
window.addEventListener("online", ()=>{ $("offlineBar").classList.remove("on"); syncQueue(); });
window.addEventListener("offline", ()=>$("offlineBar").classList.add("on"));
if(!navigator.onLine) $("offlineBar").classList.add("on");


/* ================= SINCRONIZAÇÃO EM TEMPO REAL =================
   Oito operadores usam o app ao mesmo tempo. Cada venda baixa o estoque no banco
   (trigger), e o banco avisa TODOS os aparelhos conectados pelo Realtime.
   Há três camadas, de propósito: Realtime (instantâneo), recarga periódica
   (se o socket cair) e recarga ao voltar para o app (celular bloqueado). */
let RT = null, T_PROD = null, T_PAINEL = null;

function iniciarRealtime(){
  try{ if(RT){ sb.removeChannel(RT); RT = null; } }catch(e){}
  if(!EVENT) return;
  const f = `event_id=eq.${EVENT.id}`;
  RT = sb.channel("ep-live-"+EVENT.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"ep_products",  filter:f}, onProdutoRemoto)
    .on("postgres_changes",{event:"*",schema:"public",table:"ep_categories",filter:f}, ()=>agendarRecargaProdutos())
    .on("postgres_changes",{event:"*",schema:"public",table:"ep_sales",     filter:f}, ()=>agendarPainel())
    .on("postgres_changes",{event:"*",schema:"public",table:"ep_sangrias",  filter:f}, ()=>agendarPainel())
    .on("postgres_changes",{event:"*",schema:"public",table:"ep_registers", filter:f}, onCaixaRemoto)
    .on("postgres_changes",{event:"*",schema:"public",table:"ep_reservations",filter:f}, ()=>{
        if(viewAtual()==="reservas") renderReservas(); })
    .subscribe(st=>{ if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){ setTimeout(iniciarRealtime, 4000); } });
}

/* Estoque mudou em outro aparelho: atualiza a memória e a grade, sem mexer no carrinho. */
function onProdutoRemoto(payload){
  const novo = payload.new, velho = payload.old;
  if(payload.eventType === "DELETE"){
    PRODUCTS = PRODUCTS.filter(p=>p.id !== (velho&&velho.id));
  } else if(novo){
    const i = PRODUCTS.findIndex(p=>p.id===novo.id);
    if(i>=0) PRODUCTS[i] = novo; else PRODUCTS.push(novo);
  }
  try{ localStorage.setItem("ep_products_"+EVENT.id, JSON.stringify(PRODUCTS)); }catch(e){}
  ajustarCarrinhoAoEstoque();
  agendarRedesenho();
  agendarPainel();
}

/* Se o estoque caiu abaixo do que já está no carrinho, corrige e avisa. */
function ajustarCarrinhoAoEstoque(){
  let mexeu = false;
  Object.keys(CART).forEach(pid=>{
    const p = PRODUCTS.find(x=>x.id===pid);
    if(!p){ delete CART[pid]; mexeu = true; return; }
    if(CART[pid] > Number(p.stock)){
      if(Number(p.stock) <= 0){ delete CART[pid]; toast(`${p.name} esgotou — removido do carrinho`); }
      else { CART[pid] = Number(p.stock); toast(`${p.name}: restam só ${p.stock} un`); }
      mexeu = true;
    }
  });
  if(mexeu) renderCart();
}

/* Caixa alterado por um Admin em outro aparelho (fechado/reaberto). */
function onCaixaRemoto(payload){
  const r = payload.new;
  if(r && REG && r.id === REG.id){
    if(r.status === "fechado"){ REG = null; toast("Seu caixa foi fechado pelo Administrador"); go("caixa"); }
    else { REG = r; }
  }
  agendarPainel();
}

function viewAtual(){ const v = document.querySelector(".view.on"); return v ? v.id.replace("view-","") : null; }
function agendarRedesenho(){
  clearTimeout(T_PROD);
  T_PROD = setTimeout(()=>{
    const v = viewAtual();
    if(v==="pdv" && REG){
      if(document.activeElement && document.activeElement.id==="pdvBusca") desenharGradePDV();
      else renderPDV();
    }
    else if(v==="produtos") renderProdutos();
  }, 400);
}
async function agendarRecargaProdutos(){ await loadCategories(); await loadProducts(); agendarRedesenho(); }
function agendarPainel(){
  if(viewAtual()!=="painel") return;
  clearTimeout(T_PAINEL);
  T_PAINEL = setTimeout(atualizarPainel, 1200);
}

/* Rede de segurança: recarrega periodicamente mesmo que o Realtime caia. */
setInterval(async ()=>{
  if(!EVENT || !navigator.onLine || document.hidden) return;
  const v = viewAtual();
  if(v==="pdv" || v==="produtos"){ await loadProducts(); ajustarCarrinhoAoEstoque(); agendarRedesenho(); }
}, 25000);
setInterval(()=>{ if(navigator.onLine) syncQueue(); }, 30000);

/* Ao voltar para o app (tela desbloqueada, aba retomada). */
document.addEventListener("visibilitychange", async ()=>{
  if(document.hidden || !EVENT) return;
  iniciarRealtime();
  await loadProducts();
  ajustarCarrinhoAoEstoque();
  agendarRedesenho();
  if(viewAtual()==="painel") atualizarPainel();
  syncQueue();

/* ---------- CAIXA (abertura/sangria/fechamento) ---------- */
async function abrirCaixa(){
  const cash = N($("openCash").value);
  // O mesmo operador pode ter aberto o caixa em outro aparelho: reaproveita em vez de duplicar.
  const { data:jaAberto } = await sb.from("ep_registers").select("*")
    .eq("event_id",EVENT.id).eq("operator_id",ME.id).eq("status","aberto").limit(1);
  if(jaAberto && jaAberto[0]){
    REG = jaAberto[0]; toast("Você já tinha um caixa aberto — retomando");
    renderPDV(); $("cartBar").style.display="block"; agendaEspacoCarrinho(); return;
  }
  const { data, error } = await sb.from("ep_registers").insert({
    event_id:EVENT.id, operator_id:ME.id, opening_cash:cash, opening_notes:$("openNotes").value||null
  }).select("*").single();
  if(error){ toast("Erro ao abrir caixa: "+error.message); return; }
  REG = data; audit("abertura_caixa",{register_id:REG.id,fundo:cash});
  toast("Caixa aberto"); renderPDV(); $("cartBar").style.display="block"; agendaEspacoCarrinho();
}
async function regStats(regId){
  const { data:sales } = await sb.from("ep_sales")
    .select("id,total,status,created_at,ep_sale_payments(method,amount)")
    .eq("register_id",regId).eq("status","ok");
  const { data:sang } = await sb.from("ep_sangrias").select("*").eq("register_id",regId).order("created_at");
  const by = {dinheiro:0,pix:0,debito:0,credito:0,credito_loja:0,outro:0};
  let total=0;
  (sales||[]).forEach(s=>{ total+=Number(s.total); (s.ep_sale_payments||[]).forEach(p=>by[p.method]+=Number(p.amount)); });
  const nSang = (sang||[]).reduce((s,x)=>s+Number(x.amount),0);
  return { sales:sales||[], sangrias:sang||[], total, n:(sales||[]).length, by, totalSang:nSang,
    ticket:(sales||[]).length? total/(sales||[]).length : 0 };
}

  else{ box.innerHTML=`<div class="diffbad">${diff>0?"SOBRA":"FALTA"} de caixa: ${fmt(Math.abs(diff))}</div>`; jw.style.display="block"; }

async function confirmarFechamento(){

async function eventData(eid){
  const [sales, regs, profs, sang, prods, exps, adjs, counts] = await Promise.all([
    sb.from("ep_sales").select("id,total,status,operator_id,register_id,created_at,cancel_reason,ep_sale_payments(method,amount),ep_sale_items(product_id,product_name,qty,unit_price,subtotal)").eq("event_id",eid).order("created_at",{ascending:false}),
    sb.from("ep_registers").select("*").eq("event_id",eid),
    sb.from("ep_profiles").select("id,name,role,active"),
    sb.from("ep_sangrias").select("*").eq("event_id",eid),
    sb.from("ep_products").select("*").eq("event_id",eid),
    sb.from("ep_expenses").select("*").eq("event_id",eid),
    sb.from("ep_stock_adjustments").select("*").eq("event_id",eid),
    sb.from("ep_stock_counts").select("*").eq("event_id",eid),
  ]);
  return { sales:sales.data||[], regs:regs.data||[], profs:profs.data||[], sang:sang.data||[],
           prods:prods.data||[], exps:exps.data||[], adjs:adjs.data||[], counts:counts.data||[] };
}
function aggregate(D){
  const ok = D.sales.filter(s=>s.status==="ok");
  const by={dinheiro:0,pix:0,debito:0,credito:0,credito_loja:0,outro:0};
  let total=0, cmv=0;
  const perOp={}, perProd={};
  const pname = id => (D.profs.find(p=>p.id===id)||{name:"?"}).name;
  ok.forEach(s=>{
    total+=Number(s.total);
    (s.ep_sale_payments||[]).forEach(p=>by[p.method]+=Number(p.amount));
    const o = perOp[s.operator_id] ||= { name:pname(s.operator_id), n:0, total:0, by:{dinheiro:0,pix:0,debito:0,credito:0,credito_loja:0,outro:0} };
    o.n++; o.total+=Number(s.total);
    (s.ep_sale_payments||[]).forEach(p=>o.by[p.method]+=Number(p.amount));
    (s.ep_sale_items||[]).forEach(i=>{
      const pr = D.prods.find(p=>p.id===i.product_id);
      cmv += Number(pr?.cost||0)*i.qty;
      const pp = perProd[i.product_name] ||= { name:i.product_name, qty:0, total:0, cost:0 };
      pp.qty+=i.qty; pp.total+=Number(i.subtotal); pp.cost+=Number(pr?.cost||0)*i.qty;
    });
  });
  const totalSang = D.sang.reduce((s,x)=>s+Number(x.amount),0);
  const compras = D.exps.filter(e=>e.kind==="compra").reduce((s,e)=>s+Number(e.amount),0);
  const despesas = D.exps.filter(e=>e.kind==="despesa").reduce((s,e)=>s+Number(e.amount),0);
  const taxas = ok.reduce((s,v)=>s+taxaPgtos(v.ep_sale_payments), 0);
  return { ok, total, n:ok.length, ticket: ok.length? total/ok.length:0, by, perOp, perProd,
           cmv, taxas, totalSang, compras, despesas, pname,
           liquido: total - cmv - taxas - despesas };
}

/* ---------- GRÁFICOS (SVG puro) ---------- */
const CHART = ["#1B2A5E","#B8912F","#8A8FA6","#3F7A5A","#A4402F"]; // marinho, dourado, cinza, musgo, terracota
function donut(segs, centerTop, centerBot){
  const tot = segs.reduce((s,x)=>s+x.value,0);
  const R=52, C=2*Math.PI*R, sw=16; let off=0;
  const arcs = tot>0 ? segs.filter(s=>s.value>0).map(s=>{
    const frac=s.value/tot, len=frac*C;
    const el=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.color}" stroke-width="${sw}"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" stroke-linecap="butt"/>`;
    off+=len; return el;
  }).join("") : `<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--line)" stroke-width="${sw}"/>`;
  return `<svg viewBox="0 0 140 140" width="140" height="140" style="flex:0 0 auto">${arcs}
    <text x="70" y="66" text-anchor="middle" fill="var(--txt)" font-size="16" font-weight="800">${centerTop}</text>
    <text x="70" y="84" text-anchor="middle" fill="var(--mut)" font-size="10" letter-spacing=".05em">${centerBot}</text></svg>`;
}
function hbars(items){ // [{label,value,sub,color?}]
  const max = Math.max(1, ...items.map(i=>i.value));
  return items.map((it,idx)=>`<div style="margin:9px 0">
    <div class="row" style="margin-bottom:4px"><span class="small">${esc(it.label)}</span><b class="right num small">${esc(it.sub)}</b></div>
    <div style="height:8px;background:var(--panel2);border-radius:99px;overflow:hidden">
      <div style="height:100%;width:${(it.value/max*100).toFixed(1)}%;background:${it.color||CHART[idx%CHART.length]};border-radius:99px"></div></div>
  </div>`).join("");
}
function compbar(segs){ // barra de composição empilhada
  const tot=segs.reduce((s,x)=>s+x.value,0)||1;
  return `<div style="display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--panel2)">
    ${segs.filter(s=>s.value>0).map(s=>`<div style="width:${(s.value/tot*100).toFixed(1)}%;background:${s.color}"></div>`).join("")}</div>`;
}

/* Gráfico de colunas (faturamento por hora, etc.) */
function svgColunas(items, opts){
  opts = opts || {};
  const n = Math.max(1, items.length);
  const W = 700, H = opts.h || 200, padL = 8, padB = 34, padT = 24;
  const max = Math.max(1, ...items.map(i=>i.value));
  const bw = (W - padL*2) / n;
  const barras = items.map((it,i)=>{
    const h = (it.value/max) * (H - padB - padT);
    const x = padL + i*bw, y = H - padB - h;
    const cor = it.color || (it.destaque ? "#B8912F" : "#1B2A5E");
    return `<g>
      <rect x="${(x+bw*0.15).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" fill="${cor}" rx="3"/>
      ${it.value>0?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#1B2A5E">${esc(it.top||"")}</text>`:""}
      <text x="${(x+bw/2).toFixed(1)}" y="${H-padB+14}" text-anchor="middle" font-size="10" fill="#6B6F80">${esc(it.label)}</text>
      ${it.sub?`<text x="${(x+bw/2).toFixed(1)}" y="${H-padB+25}" text-anchor="middle" font-size="9" fill="#9A9DAB">${esc(it.sub)}</text>`:""}
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="max-width:100%">
    <line x1="${padL}" y1="${H-padB}" x2="${W-padL}" y2="${H-padB}" stroke="#DDD8CC" stroke-width="1"/>
    ${barras}</svg>`;
}

/* Barra horizontal simples, boa para rankings impressos */
function svgRanking(items, opts){
  opts = opts || {};
  const max = Math.max(1, ...items.map(i=>i.value));
  return `<div class="rk">${items.map((it,i)=>`
    <div class="rkrow">
      <div class="rkpos">${i+1}</div>
      <div class="rkbody">
        <div class="rkline"><span class="rkname">${esc(it.label)}</span><b class="rkval">${esc(it.sub)}</b></div>
        <div class="rktrack"><div class="rkfill" style="width:${(it.value/max*100).toFixed(1)}%;background:${it.color||"#1B2A5E"}"></div></div>
      </div>
    </div>`).join("")}</div>`;
}

async function relatorioFinal(eid){
  toast("Montando o relatório…");
  const { data:ev } = await sb.from("ep_events").select("*").eq("id",eid).single();
  const D = await eventData(eid);
  const A = aggregate(D);
  const cats = CATEGORIES.length ? CATEGORIES : (await sb.from("ep_categories").select("*").eq("event_id",eid)).data || [];

  const ok = A.ok;
  const prodById = id => D.prods.find(p=>p.id===id);
  const hh = t => new Date(t).getHours();
  const hhmm = t => new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

  /* ---------- agregações ---------- */
  const porProd = {};   // por product_id
  let itensVendidos = 0;
  ok.forEach(s=>(s.ep_sale_items||[]).forEach(i=>{
    const p = prodById(i.product_id);
    const k = i.product_id || i.product_name;
    const r = porProd[k] ||= { id:i.product_id, nome:(p?p.name:i.product_name), code:(p?p.code:null),
      cat:(p?p.category_id:null), qty:0, receita:0, custo:0, ultima:null, inicial:(p?Number(p.stock_initial||0):0),
      restante:(p?Number(p.stock||0):0) };
    r.qty += i.qty; r.receita += Number(i.subtotal); r.custo += Number(p?.cost||0)*i.qty;
    if(!r.ultima || new Date(s.created_at) > new Date(r.ultima)) r.ultima = s.created_at;
    itensVendidos += i.qty;
  }));
  const listaProd = Object.values(porProd);

  // por hora
  const horas = {};
  ok.forEach(s=>{
    const h = hh(s.created_at);
    const b = horas[h] ||= { h, receita:0, n:0, itens:0, prods:{} };
    b.receita += Number(s.total); b.n++;
    (s.ep_sale_items||[]).forEach(i=>{
      b.itens += i.qty;
      const p = prodById(i.product_id);
      const nome = p?p.name:i.product_name;
      b.prods[nome] = (b.prods[nome]||0) + i.qty;
    });
  });
  const listaHoras = Object.values(horas).sort((a,b)=>a.h-b.h);
  const pico = listaHoras.slice().sort((a,b)=>b.receita-a.receita)[0];

  // por operador
  const porOp = {};
  ok.forEach(s=>{
    const o = porOp[s.operator_id] ||= { nome:A.pname(s.operator_id), n:0, receita:0, itens:0, ini:s.created_at, fim:s.created_at };
    o.n++; o.receita += Number(s.total);
    (s.ep_sale_items||[]).forEach(i=>o.itens += i.qty);
    if(new Date(s.created_at) < new Date(o.ini)) o.ini = s.created_at;
    if(new Date(s.created_at) > new Date(o.fim)) o.fim = s.created_at;
  });
  const listaOps = Object.values(porOp).sort((a,b)=>b.receita-a.receita);

  // por categoria
  const porCat = {};
  listaProd.forEach(r=>{
    const nome = (cats.find(c=>c.id===r.cat)||{}).name || "Sem categoria";
    const c = porCat[nome] ||= { nome, receita:0, custo:0, qty:0 };
    c.receita += r.receita; c.custo += r.custo; c.qty += r.qty;
  });
  const listaCats = Object.values(porCat).sort((a,b)=>b.receita-a.receita);
  const totCat = listaCats.reduce((s,c)=>s+c.receita,0) || 1;

  // estoque e perdas
  const perdas = D.adjs.filter(a=>a.kind==="perda"), consumos = D.adjs.filter(a=>a.kind==="consumo");
  const qPerda = pid => perdas.filter(a=>a.product_id===pid).reduce((s,a)=>s+a.qty,0);
  const qCons  = pid => consumos.filter(a=>a.product_id===pid).reduce((s,a)=>s+a.qty,0);

  // financeiro
  const lucroBruto = A.total - A.cmv;
  const resultado = lucroBruto - A.taxas - A.despesas;
  const margemV = A.total ? (lucroBruto/A.total*100) : 0;
  const canceladas = D.sales.filter(s=>s.status!=="ok");
  const difCaixa = D.regs.reduce((s,r)=>s+Number(r.difference||0),0);
  const autoFechados = D.regs.filter(r=>String(r.closing_notes||"").includes("administrativo"));
  const ini = ok.length ? ok.map(s=>s.created_at).sort()[0] : null;
  const fim = ok.length ? ok.map(s=>s.created_at).sort().slice(-1)[0] : null;
  const durH = (ini&&fim) ? Math.max(1, (new Date(fim)-new Date(ini))/3600000) : 0;

  /* ---------- recomendações automáticas ---------- */
  const rec = [];
  listaProd.forEach(r=>{
    const vendaPct = r.inicial>0 ? (r.qty/r.inicial*100) : 0;
    if(r.restante<=0 && r.qty>0){
      const sobrou = fim ? Math.max(0,(new Date(fim)-new Date(r.ultima))/3600000) : 0;
      rec.push({ tipo:"faltou", peso: r.receita + sobrou*100,
        txt:`<b>${esc(r.nome)}</b> esgotou às ${hhmm(r.ultima)}${sobrou>0.5?`, com ainda ${sobrou.toFixed(1)} h de evento pela frente`:""}. Vendeu as ${r.inicial} unidades. <b>Sugestão: levar ${Math.ceil(r.inicial*1.5)} un no próximo ano</b> (+50%).`});
    } else if(vendaPct>=80){
      rec.push({ tipo:"quase", peso:r.receita,
        txt:`<b>${esc(r.nome)}</b> vendeu ${vendaPct.toFixed(0)}% do estoque (${r.qty} de ${r.inicial}). Ficou perto de faltar — <b>subir para ${Math.ceil(r.inicial*1.3)} un</b>.`});
    } else if(r.inicial>=10 && vendaPct<=20){
      rec.push({ tipo:"sobrou", peso:(r.inicial-r.qty)*10,
        txt:`<b>${esc(r.nome)}</b> vendeu só ${vendaPct.toFixed(0)}% (${r.qty} de ${r.inicial}). Sobraram ${r.inicial-r.qty} un paradas — <b>reduzir para ${Math.max(1,Math.ceil(r.qty*1.3))} un</b> ou rever preço/exposição.`});
    }
    const marg = r.receita>0 ? ((r.receita-r.custo)/r.receita*100) : 0;
    if(r.qty>=5 && marg<15){
      rec.push({ tipo:"margem", peso:r.qty,
        txt:`<b>${esc(r.nome)}</b> vendeu bem (${r.qty} un) mas com margem de apenas ${marg.toFixed(0)}%. Cada unidade deixou ${fmt((r.receita-r.custo)/r.qty)} — <b>rever o preço</b>.`});
    }
  });
  D.prods.filter(p=>p.active && !p.parent_id && !porProd[p.id] && Number(p.stock_initial)>0).forEach(p=>{
    rec.push({ tipo:"zero", peso:Number(p.stock_initial),
      txt:`<b>${esc(p.name)}</b> não teve nenhuma venda, com ${p.stock_initial} un em estoque. <b>Avaliar retirar do mix</b> ou testar outro preço/posição na banca.`});
  });
  perdas.forEach(a=>{
    const p = prodById(a.product_id);
    if(p && a.qty>=3) rec.push({ tipo:"perda", peso:a.qty*5,
      txt:`Perda registrada de ${a.qty} un de <b>${esc(p.name)}</b>${a.reason?` (${esc(a.reason)})`:""}. Vale rever transporte/armazenamento.`});
  });
  if(pico) rec.push({ tipo:"pico", peso:9999,
    txt:`O pico de vendas foi entre <b>${pico.h}h e ${pico.h+1}h</b> (${fmt(pico.receita)} em ${pico.n} vendas). <b>Concentrar mais operadores nesse horário</b> e deixar o estoque reposto antes dele.`});
  const metodoTop = METHODS.map(([k,l])=>({k,l,v:A.by[k]})).sort((a,b)=>b.v-a.v)[0];
  if(metodoTop && A.total>0) rec.push({ tipo:"pgto", peso:9998,
    txt:`<b>${metodoTop.l}</b> respondeu por ${(metodoTop.v/A.total*100).toFixed(0)}% do faturamento. Dimensionar maquininhas, QR Codes e troco a partir dessa proporção.`});
  if(A.by.dinheiro>0) rec.push({ tipo:"troco", peso:9997,
    txt:`Entraram ${fmt(A.by.dinheiro)} em dinheiro. O fundo de troco somado nas aberturas foi de ${fmt(D.regs.reduce((s,r)=>s+Number(r.opening_cash||0),0))} — usar como referência para o próximo evento.`});
  rec.sort((a,b)=>b.peso-a.peso);

  /* ---------- documento ---------- */
  const capa = `
    <section class="pg capa">
      <div class="selo">XV</div>
      <h1>${esc(ev.name)}</h1>
      <div class="sub">${ini?fd(ini).split(",")[0]:""}</div>
      <div class="titulo">Relatório Final do Evento</div>
      <div class="linha"></div>
      <table class="meta">
        <tr><td>Período de vendas</td><td>${ini?`${fd(ini)} — ${fd(fim)}`:"sem vendas registradas"}</td></tr>
        <tr><td>Duração</td><td>${durH?durH.toFixed(1).replace(".",",")+" horas":"—"}</td></tr>
        <tr><td>Encerrado em</td><td>${ev.closed_at?fd(ev.closed_at):"—"}</td></tr>
        <tr><td>Emitido em</td><td>${fd(Date.now())}</td></tr>
        <tr><td>Responsável</td><td>${esc(ME.name)} — ${nivelNome(ME.role)}</td></tr>
        <tr><td>Sistema</td><td>PDV do Encontro · versão 3.0</td></tr>
      </table>
      <div class="resumocapa">
        <div><span>Faturamento</span><b>${fmt(A.total)}</b></div>
        <div><span>Vendas</span><b>${A.n}</b></div>
        <div><span>Resultado</span><b>${fmt(resultado)}</b></div>
      </div>
      <p class="nota">Documento gerado automaticamente a partir dos registros do sistema de ponto de venda.
        Todos os valores em reais (R$). Vendas canceladas não entram nos totais.</p>
    </section>`;

  const s1 = `
    <section class="pg">
      <h2>1 · Resumo executivo</h2>
      <div class="kgrid">

        ${donut(METHODS.map(([k,l],i)=>({label:l,value:A.by[k],color:CHART[i%CHART.length]})), fmt(A.total), "TOTAL")}
        <table class="tb">

          ${METHODS.map(([k,l],i)=>`<tr><td><span class="dot" style="background:${CHART[i%CHART.length]}"></span>${l}${TAXAS[k]?` <span class="mut2">−${TAXAS[k]}%</span>`:""}</td>
            <td class="r">${fmt(A.by[k])}</td><td class="r">${A.total?(A.by[k]/A.total*100).toFixed(1).replace(".",","):"0,0"}%</td>

/* ---------- ENCERRAMENTO DO EVENTO ----------
   Um botão só: fecha todos os caixas que ficaram abertos, encerra o evento e
   apresenta a contabilidade geral consolidada. */
async function modalEncerrarEvento(){
  if(!EVENT){ toast("Nenhum evento ativo"); return; }
  if(!isAdmin()){ toast("Seu nível de acesso não permite encerrar o evento"); return; }

  const D = await eventData(EVENT.id);
  const A = aggregate(D);
  const abertos = D.regs.filter(r=>r.status==="aberto");
  const pend = JSON.parse(localStorage.getItem("ep_queue")||"[]").length;

  // Dinheiro esperado de cada caixa que ainda está aberto
  const esperado = r => {
    const din = D.sales.filter(s=>s.register_id===r.id && s.status==="ok")
      .flatMap(s=>s.ep_sale_payments||[]).filter(p=>p.method==="dinheiro")
      .reduce((s,p)=>s+Number(p.amount),0);
    const sg = D.sang.filter(s=>s.register_id===r.id).reduce((s,x)=>s+Number(x.amount),0);
    return Number(r.opening_cash) + din - sg;
  };

  openModal(`<h2>Encerrar evento</h2>
    <p class="mut small">${esc(EVENT.name)} · ${A.n} vendas · ${fmt(A.total)} faturados</p>

    ${pend?`<div class="alertline bad">⚠️ Há ${pend} venda(s) na fila offline deste aparelho, ainda não enviadas.
      Conecte-se à internet e espere a sincronização antes de encerrar, ou elas ficarão de fora da contabilidade.</div>`:""}

    ${abertos.length?`<div class="alertline amber">
      <b>${abertos.length} caixa(s) ainda aberto(s).</b> Serão fechados automaticamente com o valor esperado abaixo,
      sem conferência física do dinheiro. Confira as gavetas antes de confirmar.
    </div>
    <div class="card" style="margin-top:8px">
      ${abertos.map(r=>`<div class="row small" style="padding:6px 0;border-bottom:1px dashed var(--line)">
        <span>${esc(A.pname(r.operator_id))} · aberto ${fdt(r.opened_at)}</span>
        <b class="right num">${fmt(esperado(r))}</b></div>`).join("")}
      <div class="row" style="padding-top:8px"><b>Dinheiro esperado nas gavetas</b>
        <b class="right num">${fmt(abertos.reduce((s,r)=>s+esperado(r),0))}</b></div>
    </div>`
    :`<div class="alertline ok">✓ Todos os caixas já estão fechados.</div>`}

    <div class="card" style="margin-top:10px">
      <div class="row" style="padding:4px 0"><span>Faturamento</span><b class="right num">${fmt(A.total)}</b></div>
      <div class="row" style="padding:4px 0"><span>Custo das mercadorias vendidas</span><b class="right num">−${fmt(A.cmv)}</b></div>
      ${A.taxas>0.004?`<div class="row" style="padding:4px 0"><span>Taxas de cartão</span><b class="right num">−${fmt(A.taxas)}</b></div>`:""}
      <div class="row" style="padding:4px 0"><span>Despesas</span><b class="right num">−${fmt(A.despesas)}</b></div>
      <hr><div class="row"><b>Resultado</b><b class="right num" style="font-size:18px">${fmt(A.total-A.cmv-A.taxas-A.despesas)}</b></div>
    </div>

    <p class="mut small" style="margin-top:10px">Depois de encerrado, novas vendas ficam bloqueadas.
      O evento pode ser reaberto pelo Admin Master na aba Painel, se necessário.</p>
    <label>Digite <b>ENCERRAR</b> para confirmar</label>
    <input id="encConf" placeholder="ENCERRAR" autocapitalize="characters">
    <div style="height:10px"></div>
    <button class="btn danger block" onclick="confirmarEncerramento()">Encerrar evento, fechar caixas e gerar o relatório</button>
    <div style="height:8px"></div>
    <button class="btn block" onclick="closeModal()">Cancelar</button>`);
}

async function confirmarEncerramento(){
  if(($("encConf").value||"").trim().toUpperCase() !== "ENCERRAR"){
    toast('Digite ENCERRAR para confirmar'); return;
  }
  const eid = EVENT.id;
  const { data, error } = await sb.rpc("ep_encerrar_evento", { p_event_id: eid });
  if(error){ toast("Não foi possível encerrar: "+error.message); return; }
  audit("evento_encerrado",{ event_id:eid, caixas_fechados:data?.caixas_fechados||0 });
  closeModal();
  REG = null;
  toast(`Evento encerrado · ${data?.caixas_fechados||0} caixa(s) fechado(s)`);
  await loadEvent();
  buildNav();
  await relatorioFinal(eid);
}

async function encerrarEvento(eid){
  const { data:open } = await sb.from("ep_registers").select("id").eq("event_id",eid).eq("status","aberto");
  if(open&&open.length){ toast(`Há ${open.length} caixa(s) aberto(s). Feche todos antes de encerrar.`); return; }
  if(!confirm("Encerrar o evento? Novas vendas serão bloqueadas.")) return;
  await sb.from("ep_events").update({status:"encerrado",closed_at:new Date().toISOString()}).eq("id",eid);
  audit("evento_encerrado",{event_id:eid});
  toast("Evento encerrado"); await loadEvent(); renderEvento();
}
async function fechamentoGeral(eid){

      <tr><td>Saldo final (entradas − saídas)</td><td>${fmt(A.total - saidas)}</td></tr>
      <tr><td>Total de sangrias</td><td>${fmt(A.totalSang)}</td></tr>
    </table>
    <h2>Formas de pagamento</h2>
    <table>${METHODS.map(([k,l])=>`<tr><td>${l}</td><td>${fmt(A.by[k])}</td></tr>`).join("")}</table>
    <h2>Estoque</h2>
    <table><tr><th>Produto</th><th>Inicial</th><th>Vendidos</th><th>Perdidos</th><th>Consumo interno</th><th>Restante</th></tr>
    ${D.prods.map(p=>{
      const v = (A.perProd[p.name]||{qty:0}).qty;
      const pe = perdas.filter(a=>a.product_id===p.id).reduce((s,a)=>s+a.qty,0);
      const co = consumos.filter(a=>a.product_id===p.id).reduce((s,a)=>s+a.qty,0);
      return `<tr><td>${esc(p.name)}</td><td>${p.stock_initial}</td><td>${v}</td><td>${pe}</td><td>${co}</td><td>${p.stock}</td></tr>`; }).join("")}
    <tr><td><b>Totais</b></td><td></td><td><b>${vendidos}</b></td><td><b>${qPerdas}</b></td><td><b>${qCons}</b></td><td><b>${D.prods.reduce((s,p)=>s+p.stock,0)}</b></td></tr></table>
    <h2>Operadores</h2>
    <table><tr><th>Operador</th><th>Vendas</th><th>Vendido</th><th>Dinheiro</th><th>Pix</th><th>Cartão</th><th>Sangrias</th><th>Diferença de caixa</th></tr>
    ${Object.entries(A.perOp).map(([oid,o])=>{
      const sg = D.sang.filter(s=>{const r=D.regs.find(r=>r.id===s.register_id);return r&&r.operator_id===oid;}).reduce((s,x)=>s+Number(x.amount),0);
      const df = D.regs.filter(r=>r.operator_id===oid&&r.status==="fechado").reduce((s,r)=>s+Number(r.difference||0),0);

  $("printArea").innerHTML = html;
  openModal(`<h2>Fechamento Geral</h2><p class="mut small">Relatório consolidado gerado. Escolha o formato:</p>
    <div class="grid2">
      <button class="btn primary" onclick="window.print()">📄 PDF (imprimir)</button>

/* ================= CRÉDITO DO CLIENTE =================
   Quando alguém paga a mais, devolve um item ou deixa troco, o valor fica como
   crédito no nome da pessoa e pode ser usado em outra compra do evento. */
let CREDITOS = [], CRED_CLIENTE = null;

async function loadCreditos(){
  if(!EVENT){ CREDITOS=[]; return; }
  const { data } = await sb.from("ep_credits").select("*")
    .eq("event_id", EVENT.id).order("balance",{ascending:false});
  if(data) CREDITOS = data;
}
const saldoDe = nome => {
  const c = CREDITOS.find(x=>x.customer_name.toLowerCase() === String(nome||"").toLowerCase().trim());
  return c ? Number(c.balance) : 0;
};

async function renderCreditos(){
  const el = $("view-creditos");
  await loadCreditos();
  const total = CREDITOS.reduce((s,c)=>s+Number(c.balance),0);
  const comSaldo = CREDITOS.filter(c=>Number(c.balance) > 0.004);
  el.innerHTML = `
    <h2 style="margin-bottom:10px">Créditos de clientes</h2>
    <div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><div class="v num">${comSaldo.length}</div><div class="l">Clientes com saldo</div></div>
      <div class="kpi"><div class="v num">${fmt(total)}</div><div class="l">Total em crédito</div></div>
    </div>
    <button class="btn primary block" onclick="modalNovoCredito()">+ Lançar crédito</button>
    <p class="mut small" style="margin:8px 0 12px">O crédito é dinheiro que já entrou no caixa e ainda não virou
      produto. Para usar, escolha <b>Crédito</b> como forma de pagamento na venda.</p>
    ${CREDITOS.map(c=>`<div class="card">
      <div class="row">
        <b>${esc(c.customer_name)}</b>
        ${c.customer_phone?`<span class="mut small">${esc(c.customer_phone)}</span>`:""}
        <b class="right num" style="font-size:19px;color:${Number(c.balance)>0.004?'var(--ok)':'var(--mut)'}">${fmt(c.balance)}</b>
      </div>
      <div class="row" style="margin-top:8px;gap:6px">
        <button class="btn small" onclick="modalNovoCredito('${esc(c.customer_name)}')">Adicionar</button>
        <button class="btn small" onclick="modalUsarCredito('${c.id}')" ${Number(c.balance)>0.004?"":"disabled"}>Baixar manualmente</button>
        <button class="btn small ghost right" onclick="verHistoricoCredito('${c.id}','${esc(c.customer_name)}')">Histórico</button>
      </div>
    </div>`).join("") || `<div class="card mut">Nenhum crédito lançado.</div>`}`;
}

function modalNovoCredito(nome){
  openModal(`<h2>Lançar crédito</h2>
    <p class="mut small">Use quando o cliente pagou a mais, desistiu de um item já pago,
      ou deixou o troco para usar depois.</p>
    <label>Nome do cliente</label><input id="crNome" value="${esc(nome||"")}" placeholder="Nome de quem tem o crédito">
    <label>Telefone (opcional)</label><input id="crFone" inputmode="tel">
    <label>Valor do crédito</label><input id="crValor" inputmode="decimal" placeholder="0,00">
    <label>Motivo</label><input id="crMotivo" placeholder="ex.: troco não devolvido, pagou a mais">
    <div style="height:12px"></div>
    <button class="btn primary block" onclick="salvarCredito()">Lançar crédito</button>`);
}
async function salvarCredito(){
  const nome = ($("crNome").value||"").trim(), v = N($("crValor").value);
  if(!nome){ toast("Informe o nome"); return; }
  if(v<=0){ toast("Informe um valor maior que zero"); return; }
  const { error } = await sb.rpc("ep_credito_mov", { p_event:EVENT.id, p_nome:nome,
    p_fone:($("crFone").value||"").trim(), p_delta:v,
    p_motivo:($("crMotivo").value||"").trim()||"Crédito lançado", p_sale:null });
  if(error){ toast(error.message); return; }
  audit("credito_lancado",{cliente:nome, valor:v});
  closeModal(); toast(`Crédito de ${fmt(v)} para ${nome}`); renderCreditos();
}

function modalUsarCredito(id){
  const c = CREDITOS.find(x=>x.id===id); if(!c) return;
  openModal(`<h2>Baixar crédito</h2>
    <p class="mut small">${esc(c.customer_name)} · saldo ${fmt(c.balance)}</p>
    <p class="mut small">Use só para acertos manuais (devolução em dinheiro, por exemplo).
      Quando o crédito paga uma compra, o desconto acontece sozinho na venda.</p>
    <label>Valor a baixar</label><input id="udValor" inputmode="decimal" value="${Number(c.balance).toFixed(2).replace(".",",")}">
    <label>Motivo</label><input id="udMotivo" placeholder="ex.: devolvido em dinheiro">
    <div style="height:12px"></div>
    <button class="btn danger block" onclick="confirmarBaixaCredito('${id}')">Baixar do saldo</button>`);
}
async function confirmarBaixaCredito(id){
  const c = CREDITOS.find(x=>x.id===id); if(!c) return;
  const v = N($("udValor").value);
  if(v<=0){ toast("Valor inválido"); return; }
  const { error } = await sb.rpc("ep_credito_mov", { p_event:EVENT.id, p_nome:c.customer_name,

function ajustaPagoReserva(total){
  const v = $("resPago").value;
  $("resFormaBox").style.display = v==="0" ? "none" : "block";
  if(v==="1") $("resValorPago").value = total.toFixed(2).replace(".",",");
  if(v==="2") $("resValorPago").value = "";
  avisoPagoReserva(total);
}
function avisoPagoReserva(total){
  const el = $("resAviso"); if(!el) return;
  const pago = N($("resValorPago").value);
  if(pago > total + 0.004){
    el.innerHTML = `Pagou <b>${fmt(pago-total)}</b> a mais — a diferença vira crédito do cliente.`;
    el.style.color = "var(--ok)";
  } else if(pago < total - 0.004){
    el.innerHTML = `Falta <b>${fmt(total-pago)}</b> para quitar — cobrar na retirada.`;
    el.style.color = "var(--bad)";
  } else { el.textContent = "Valor exato da reserva."; el.style.color = "var(--mut)"; }
}
async function salvarReserva(){
  const nome = ($("resNome").value||"").trim();
  if(!nome){ toast("Informe o nome do cliente"); return; }
  const R = resumoCarrinho();
  const modo = $("resPago").value;
  const valorPago = modo === "0" ? 0 : N($("resValorPago").value);
  const pago = valorPago >= R.total - 0.004;
  const itens = R.linhas.map(l=>({ product_id:l.p.id, product_name:l.p.name, qty:l.q,
                                   unit_price:Number(l.p.price), subtotal:Math.round(l.liquido*100)/100 }));
  const { error } = await sb.rpc("ep_reservar", { p: {
    event_id: EVENT.id, operator_id: ME.id, register_id: REG ? REG.id : null,
    customer_name: nome, customer_phone: ($("resTel").value||"").trim(),
    items: itens, total: R.total, paid: pago, paid_amount: valorPago,
    paid_method: valorPago>0 ? $("resForma").value : null,
    notes: ($("resObs").value||"").trim()
  }});
  if(error){ toast("Não foi possível reservar: "+error.message); return; }
  audit("reserva_criada", { cliente:nome, total:R.total, pago:valorPago });
  if(valorPago > R.total + 0.004){
    const sobra = Math.round((valorPago - R.total)*100)/100;
    const r2 = await sb.rpc("ep_credito_mov", { p_event:EVENT.id, p_nome:nome, p_fone:null,
      p_delta:sobra, p_motivo:"Pagou a mais na reserva", p_sale:null });
    if(!r2.error) toast(`Crédito de ${fmt(sobra)} para ${nome}`);
  }
  CART={}; PAY=null; DESC_ITEM={}; DESC_GERAL=0; KIT=null; CART_ABERTO=false;
  closeModal(); toast(`Reserva de ${nome} registrada`);
  await loadProducts(); renderPDV();
}

function editarReserva(id){
  const r = RESERVAS.find(x=>x.id===id); if(!r) return;
  openModal(`<h2>Editar reserva</h2>
    <label>Nome do cliente</label><input id="edNome" value="${esc(r.customer_name)}">
    <label>Telefone</label><input id="edFone" inputmode="tel" value="${esc(r.customer_phone||"")}">
